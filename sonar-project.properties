sonar.organization=guhilling
sonar.projectKey=guhilling_ai-assisted-todolist

sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test,frontend/src
sonar.test.inclusions=backend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
# The generated wire types and the ahead-of-time compiled Ajv validators. Analysing machine
# output says nothing about the code anyone writes; the schemas they come from are reviewed.
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/generated/**

sonar.java.binaries=backend/target/classes
# quarkus-jacoco writes here, not to the jacoco-maven-plugin's target/site/jacoco.
# It is the only report that sees the bytecode Quarkus actually runs.
sonar.coverage.jacoco.xmlReportPaths=backend/target/jacoco-report/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

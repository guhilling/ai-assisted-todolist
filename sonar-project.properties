sonar.organization=guhilling
sonar.projectKey=guhilling_ai-assisted-todolist

sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test,frontend/src
sonar.test.inclusions=backend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
# The generated wire types and the ahead-of-time compiled Ajv validators. Analysing machine
# output says nothing about the code anyone writes; the schemas they come from are reviewed.
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/generated/**

sonar.java.binaries=backend/target/classes
# quarkus-jacoco writes here, not to the jacoco-maven-plugin's target/site/jacoco.
# It is the only report that sees the bytecode Quarkus actually runs.
sonar.coverage.jacoco.xmlReportPaths=backend/target/jacoco-report/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# S1135 ("Complete the task associated to this TODO comment") is off. It cannot be narrowed --
# it has no parameters in SonarCloud -- so it fired on the domain word itself: the TODO_
# environment-variable prefix and the TODO task state, 13 times, every one closed by hand as a
# false positive. The rule it stood for is enforced in CI instead, narrowed to the marker
# `TODO:`, and stricter: a `TODO:` comment fails the build, because to-dos are issues, not
# comments (#121). Checkstyle's TodoComment does it for Java, oxlint's no-warning-comments for
# TypeScript.
sonar.issue.ignore.multicriteria=todoJava,todoTs
sonar.issue.ignore.multicriteria.todoJava.ruleKey=java:S1135
sonar.issue.ignore.multicriteria.todoJava.resourceKey=**/*
sonar.issue.ignore.multicriteria.todoTs.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.todoTs.resourceKey=**/*

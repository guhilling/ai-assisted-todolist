sonar.organization=guhilling
sonar.projectKey=guhilling_ai-assisted-todolist

sonar.sources=backend/src/main,frontend/src,serverless
sonar.tests=backend/src/test,frontend/src,serverless
# frontend/src/testing is the component tests' shared stub and fixtures: test code, like the
# test files themselves, and no more a subject of coverage than they are.
sonar.test.inclusions=backend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/testing/**,serverless/**/*_test.go
# The generated wire types and the ahead-of-time compiled Ajv validators, and the Go backend's
# generated routes and types. Analysing machine output says nothing about the code anyone writes;
# the schemas they come from are reviewed.
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/testing/**,frontend/src/generated/**,serverless/**/*_test.go,serverless/**/*.gen.go
# The Go backend's entry points and its code generator: wiring that only runs on Lambda, on a
# developer's machine or in go generate, where a unit test would test the mocks it needs.
sonar.coverage.exclusions=serverless/cmd/**,serverless/tools/**

sonar.java.binaries=backend/target/classes
# quarkus-jacoco writes here, not to the jacoco-maven-plugin's target/site/jacoco.
# It is the only report that sees the bytecode Quarkus actually runs.
sonar.coverage.jacoco.xmlReportPaths=backend/target/jacoco-report/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.go.coverage.reportPaths=serverless/coverage.out

# S1135 ("Complete the task associated to this TODO comment") is off. It cannot be narrowed --
# it has no parameters in SonarCloud -- so it fired on the domain word itself: the TODO_
# environment-variable prefix and the TODO task state, 13 times, every one closed by hand as a
# false positive. The rule it stood for is enforced in CI instead, narrowed to the marker
# `TODO:`, and stricter: a `TODO:` comment fails the build, because to-dos are issues, not
# comments (#121). Checkstyle's TodoComment does it for Java, oxlint's no-warning-comments for
# TypeScript.
#
# A false positive is silenced at its line with NOSONAR and the reason, which moves with the code
# (#561; doc/decisions/build-and-dependencies.md). The two below are taint-analysis findings, for
# which NOSONAR is not documented to work, so they are off for this one file: the download in
# FilePreview.tsx fetches a link storageUrl has already checked (HTTPS, or HTTP to this machine),
# and the analysis does not see the check.
sonar.issue.ignore.multicriteria=todoJava,todoTs,downloadServerForgery,downloadClientForgery
sonar.issue.ignore.multicriteria.todoJava.ruleKey=java:S1135
sonar.issue.ignore.multicriteria.todoJava.resourceKey=**/*
sonar.issue.ignore.multicriteria.todoTs.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.todoTs.resourceKey=**/*
sonar.issue.ignore.multicriteria.downloadServerForgery.ruleKey=tssecurity:S5144
sonar.issue.ignore.multicriteria.downloadServerForgery.resourceKey=frontend/src/components/FilePreview.tsx
sonar.issue.ignore.multicriteria.downloadClientForgery.ruleKey=tssecurity:S8476
sonar.issue.ignore.multicriteria.downloadClientForgery.resourceKey=frontend/src/components/FilePreview.tsx

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: todolist
      POSTGRES_USER: todolist
      POSTGRES_PASSWORD: todolist
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/todolist
      QUARKUS_DATASOURCE_USERNAME: todolist
      QUARKUS_DATASOURCE_PASSWORD: todolist
      FRONTEND_ORIGINS: http://localhost:3000
      QUARKUS_OIDC_ENABLED: ${QUARKUS_OIDC_ENABLED:-false}
      TODO_AUTH_ENABLED: ${TODO_AUTH_ENABLED:-false}
      TODO_OIDC_GOOGLE_CLIENT_ID: ${TODO_OIDC_GOOGLE_CLIENT_ID:-}
      TODO_OIDC_GOOGLE_CLIENT_SECRET: ${TODO_OIDC_GOOGLE_CLIENT_SECRET:-}
      TODO_AUTH_POST_LOGIN_REDIRECT_URI: ${TODO_AUTH_POST_LOGIN_REDIRECT_URI:-http://localhost:3000/}
      TODO_OIDC_COOKIE_SECURE: ${TODO_OIDC_COOKIE_SECURE:-false}
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:

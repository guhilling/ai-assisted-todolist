services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: todolist
      POSTGRES_USER: todolist
      POSTGRES_PASSWORD: todolist
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/todolist
      QUARKUS_DATASOURCE_USERNAME: todolist
      QUARKUS_DATASOURCE_PASSWORD: todolist
      FRONTEND_ORIGINS: http://localhost:3000
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:

# Backend overrides for the end-to-end stack, mounted into the container and pointed at by
# SMALLRYE_CONFIG_LOCATIONS. Keeping them here rather than in application.properties means the
# published image carries no end-to-end test configuration.
#
# The container runs the prod profile, so these entries are prod-profiled too in order to win
# over the Google defaults in application.properties.
%prod.quarkus.oidc.auth-server-url=http://keycloak:8082/realms/taskfest
%prod.quarkus.oidc.client-id=taskfest-backend
%prod.quarkus.oidc.credentials.secret=taskfest-secret
%prod.quarkus.oidc.authentication.scopes=email,profile
%prod.taskfest.auth.enabled=true
%prod.taskfest.post-login-redirect-uri=http://localhost:3000/
%prod.taskfest.auth.providers.keycloak.label=Keycloak
%prod.taskfest.auth.providers.keycloak.client-id=taskfest-backend
%prod.taskfest.auth.providers.keycloak.client-secret=taskfest-secret
%prod.taskfest.auth.providers.keycloak.issuer=http://localhost:8082/realms/taskfest

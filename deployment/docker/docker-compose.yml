# Production-shaped local stack: PostgreSQL, the Quarkus backend and the httpd-served
# frontend, with no identity provider. Sign-in is off unless you supply Google credentials,
# so this is the stack for checking the deployment shape, not for working on the app --
# `./mvnw quarkus:dev` is far better for that. See doc/local-development/dev-mode.md.
#
# The project name is pinned because Compose otherwise derives it from this file's directory,
# which would rename the postgres volume to docker_postgres-data and orphan the existing one.
name: taskfest

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taskfest
      POSTGRES_USER: taskfest
      POSTGRES_PASSWORD: taskfest
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    # Built by Jib, not by a Dockerfile: `cd backend && ./mvnw package
    # -Dquarkus.container-image.build=true` produces this image locally. There is no
    # Dockerfile under backend/ to build from -- the ones Quarkus generates in
    # src/main/docker are JDK 17 based and cannot run this Java 25 code.
    image: ${BACKEND_IMAGE:-quay.io/ghilling/taskfest-backend:latest}
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/taskfest
      QUARKUS_DATASOURCE_USERNAME: taskfest
      QUARKUS_DATASOURCE_PASSWORD: taskfest
      FRONTEND_ORIGINS: http://localhost:3000
      QUARKUS_OIDC_ENABLED: ${QUARKUS_OIDC_ENABLED:-false}
      TASKFEST_AUTH_ENABLED: ${TASKFEST_AUTH_ENABLED:-false}
      TASKFEST_OIDC_GOOGLE_CLIENT_ID: ${TASKFEST_OIDC_GOOGLE_CLIENT_ID:-}
      TASKFEST_OIDC_GOOGLE_CLIENT_SECRET: ${TASKFEST_OIDC_GOOGLE_CLIENT_SECRET:-}
      TASKFEST_AUTH_POST_LOGIN_REDIRECT_URI: ${TASKFEST_AUTH_POST_LOGIN_REDIRECT_URI:-http://localhost:3000/}
      TASKFEST_OIDC_COOKIE_SECURE: ${TASKFEST_OIDC_COOKIE_SECURE:-false}
      # No attachment bucket in this stack, so nothing for the orphan clean-up (#208) to list.
      TASKFEST_ATTACHMENTS_ORPHAN_SWEEP_EVERY: "off"
      # Nor anywhere to keep account deletion records (#213).
      TASKFEST_ACCOUNT_DELETIONS_ENABLED: "false"
      # Behind httpd, which now reaches the backend over TLS (#247): the scheme the browser used
      # comes from httpd's X-Forwarded-Proto, as it comes from the load balancer's in AWS.
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_HTTP_PROXY_ALLOW_X_FORWARDED: "true"
    depends_on:
      - postgres
    ports:
      # TLS, with the self-signed certificate the backend makes at start (#247).
      - "8443:8443"

  frontend:
    build:
      context: ../../frontend
      dockerfile: docker/Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  postgres-data:

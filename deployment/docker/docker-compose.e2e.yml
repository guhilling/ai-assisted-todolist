# Full stack for the browser end-to-end tests: PostgreSQL, Keycloak, the Quarkus backend and
# the httpd-served frontend.
#
# Keycloak is published on localhost:8082 for the browser, while the backend reaches it inside
# the compose network as keycloak:8082. KC_HOSTNAME_BACKCHANNEL_DYNAMIC lets those two differ:
# the issuer and the login URL stay on localhost, and the token/JWKS endpoints the backend
# discovers follow whichever host asked for them. No hosts-file entry is needed.
# A distinct project name keeps this stack from colliding with the dev stack above: without
# it both derive the same name from this directory and each treats the other's containers as
# orphans. This stack owns no volumes and is always torn down with `down -v`.
name: taskfest-e2e

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taskfest
      POSTGRES_USER: taskfest
      POSTGRES_PASSWORD: taskfest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskfest -d taskfest"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm", "--http-port=8082"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8082
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ../../keycloak/realm-taskfest.json:/opt/keycloak/data/import/realm-taskfest.json:ro
    ports:
      - "8082:8082"
    healthcheck:
      # The image ships no curl, so talk to the realm endpoint over bash's /dev/tcp. Asking for
      # the realm metadata also proves the import finished, not just that the port is open.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8082 &&
          printf 'GET /realms/taskfest/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost:8082\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q '200'
      interval: 5s
      timeout: 5s
      retries: 40

  backend:
    image: ${BACKEND_IMAGE:-quay.io/ghilling/taskfest-backend:latest}
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/taskfest
      QUARKUS_DATASOURCE_USERNAME: taskfest
      QUARKUS_DATASOURCE_PASSWORD: taskfest
      FRONTEND_ORIGINS: http://localhost:3000
      QUARKUS_OIDC_ENABLED: "true"
      TASKFEST_OIDC_COOKIE_SECURE: "false"
      # No attachment bucket in this stack, so nothing for the orphan clean-up (#208) to list.
      TASKFEST_ATTACHMENTS_ORPHAN_SWEEP_EVERY: "off"
      # Nor anywhere to keep account deletion records (#213).
      TASKFEST_ACCOUNT_DELETIONS_ENABLED: "false"
      SMALLRYE_CONFIG_LOCATIONS: /config/backend-e2e.properties
    volumes:
      - ../../e2e/backend-e2e.properties:/config/backend-e2e.properties:ro
      - ../../e2e/backend-healthcheck.sh:/config/healthcheck.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      # Without this, `up --wait` treats the backend as ready the moment the container runs,
      # and Playwright starts against an application still booting -- it answers 502 through
      # httpd until then. The probe is a mounted script rather than an inline command because
      # an inline one is split on whitespace into separate argv entries; see the script.
      test: ["CMD", "bash", "/config/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 24

  frontend:
    image: ${FRONTEND_IMAGE:-taskfest-frontend:e2e}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

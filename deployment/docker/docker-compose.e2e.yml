# Full stack for the browser end-to-end tests: PostgreSQL, Keycloak, S3 (LocalStack), the Quarkus
# backend and the httpd-served frontend.
#
# Keycloak is published on localhost:8082 for the browser, while the backend reaches it inside
# the compose network as keycloak:8082. KC_HOSTNAME_BACKCHANNEL_DYNAMIC lets those two differ:
# the issuer and the login URL stay on localhost, and the token/JWKS endpoints the backend
# discovers follow whichever host asked for them. No hosts-file entry is needed.
#
# S3 needs one address both sides can use, because the backend signs links the browser then
# follows (#204): s3.localhost:4566. The browser resolves every *.localhost to 127.0.0.1, where the
# port is published; inside the network the same name is an alias of the LocalStack container. So
# the signed host and the requested host are one, as they are against AWS.
# A distinct project name keeps this stack from colliding with the dev stack above: without
# it both derive the same name from this directory and each treats the other's containers as
# orphans. This stack owns no volumes and is always torn down with `down -v`.
name: taskfest-e2e

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taskfest
      POSTGRES_USER: taskfest
      POSTGRES_PASSWORD: taskfest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskfest -d taskfest"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm", "--http-port=8082"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8082
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ../../keycloak/realm-taskfest.json:/opt/keycloak/data/import/realm-taskfest.json:ro
    ports:
      - "8082:8082"
    healthcheck:
      # The image ships no curl, so talk to the realm endpoint over bash's /dev/tcp. Asking for
      # the realm metadata also proves the import finished, not just that the port is open.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8082 &&
          printf 'GET /realms/taskfest/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost:8082\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q '200'
      interval: 5s
      timeout: 5s
      retries: 40

  localstack:
    # The tag the backend's own tests run (Quarkus Dev Services), so both test against one S3.
    image: localstack/localstack:4.13
    environment:
      SERVICES: s3
      # Check signatures as AWS does: otherwise a link signed for one size accepts any (#204).
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    volumes:
      - ../../e2e/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
      - ../../e2e/localstack-healthcheck.sh:/config/healthcheck.sh:ro
    ports:
      - "4566:4566"
    networks:
      default:
        aliases:
          - s3.localhost
    healthcheck:
      test: ["CMD", "bash", "/config/healthcheck.sh"]
      interval: 3s
      timeout: 3s
      retries: 40

  backend:
    image: ${BACKEND_IMAGE:-quay.io/ghilling/taskfest-backend:latest}
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/taskfest
      QUARKUS_DATASOURCE_USERNAME: taskfest
      QUARKUS_DATASOURCE_PASSWORD: taskfest
      FRONTEND_ORIGINS: http://localhost:3000
      QUARKUS_OIDC_ENABLED: "true"
      TASKFEST_OIDC_COOKIE_SECURE: "false"
      SMALLRYE_CONFIG_LOCATIONS: /config/backend-e2e.properties
      # Behind httpd, which now reaches the backend over TLS (#247): the scheme the browser used
      # comes from httpd's X-Forwarded-Proto, as it comes from the load balancer's in AWS.
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_HTTP_PROXY_ALLOW_X_FORWARDED: "true"
      # And the host the browser used, port included, from mod_proxy's X-Forwarded-Host: trusting
      # X-Forwarded-Proto alone resets the port, and sign-in lost the browser's :3000.
      QUARKUS_HTTP_PROXY_ENABLE_FORWARDED_HOST: "true"
    volumes:
      - ../../e2e/backend-e2e.properties:/config/backend-e2e.properties:ro
      - ../../e2e/backend-healthcheck.sh:/config/healthcheck.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      # TLS, with the self-signed certificate the backend makes at start (#247).
      - "8443:8443"
    healthcheck:
      # Without this, `up --wait` treats the backend as ready the moment the container runs,
      # and Playwright starts against an application still booting -- it answers 502 through
      # httpd until then. The probe is a mounted script rather than an inline command because
      # an inline one is split on whitespace into separate argv entries; see the script.
      test: ["CMD", "bash", "/config/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Whether the backend is serving, asked over TLS (#247). The backend's own image cannot ask: it
  # has bash but no curl, and bash's /dev/tcp speaks plain TCP. So this container asks for it, with
  # -k as the load balancer does, and the frontend waits for it rather than for the open port.
  backend-ready:
    image: docker.io/curlimages/curl:8.22.0
    command: ["sleep", "infinity"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "-o", "/dev/null", "https://backend:8443/api/auth/providers"]
      interval: 3s
      timeout: 5s
      retries: 40

  frontend:
    image: ${FRONTEND_IMAGE:-taskfest-frontend:e2e}
    depends_on:
      backend-ready:
        condition: service_healthy
    ports:
      - "3000:8080"

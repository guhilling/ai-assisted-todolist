  <polyline points="250,364 250,420" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="262" y="397" text-anchor="start" font-size="11" fill="#9aa5b1">invokes its alias live</text>
  <rect x="40" y="560" width="200" height="64" rx="10" fill="#3a2a17" stroke="#f6ad55" stroke-width="1.5"/>
  <text x="140.0" y="587.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">S3</text>
  <text x="140.0" y="606.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">attachments · serverless/</text>
  <rect x="260" y="560" width="200" height="64" rx="10" fill="#3a2a17" stroke="#f6ad55" stroke-width="1.5"/>
  <text x="360.0" y="587.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">DynamoDB</text>
  <text x="360.0" y="606.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">one table · TTL · stream</text>
  <polyline points="140,500 140,560" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="152" y="535" text-anchor="start" font-size="11" fill="#9aa5b1">signs links</text>
  <polyline points="360,500 360,560" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="372" y="535" text-anchor="start" font-size="11" fill="#9aa5b1">reads, writes</text>
  <polyline points="40,98 20,98 20,600 40,600" fill="none" stroke="#8ab4f8" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
  <text x="40" y="646" text-anchor="start" font-size="12" fill="#8ab4f8">files: presigned PUT and GET, straight</text>
  <text x="40" y="662" text-anchor="start" font-size="12" fill="#8ab4f8">from the browser and the apps</text>
  <rect x="40" y="700" width="200" height="64" rx="10" fill="#1f2b3d" stroke="#8ab4f8" stroke-width="1.5"/>
  <text x="140.0" y="727.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">orphans · replay</text>
  <text x="140.0" y="746.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">on EventBridge Scheduler</text>
  <rect x="260" y="700" width="200" height="64" rx="10" fill="#1f2b3d" stroke="#8ab4f8" stroke-width="1.5"/>

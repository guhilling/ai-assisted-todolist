  <text x="140.0" y="997.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">8 alarms</text>
  <text x="140.0" y="1016.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">on metrics and log lines</text>
  <rect x="260" y="970" width="200" height="64" rx="10" fill="#1f2b3d" stroke="#8ab4f8" stroke-width="1.5"/>
  <text x="360.0" y="997.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">logship</text>
  <text x="360.0" y="1016.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">Go on Lambda · qa</text>
  <polyline points="140,914 140,970" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="152" y="947" text-anchor="start" font-size="11" fill="#9aa5b1">metric filters</text>
  <polyline points="360,914 360,970" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="372" y="947" text-anchor="start" font-size="11" fill="#9aa5b1">subscription</text>
  <rect x="40" y="1090" width="200" height="64" rx="10" fill="#3a2a17" stroke="#f6ad55" stroke-width="1.5"/>
  <text x="140.0" y="1117.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">SNS · User Notifications</text>
  <text x="140.0" y="1136.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">taskfest-&lt;env&gt;-alerts</text>
  <rect x="260" y="1090" width="540" height="64" rx="10" fill="#1c3326" stroke="#81c995" stroke-width="1.5"/>

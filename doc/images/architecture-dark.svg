  <text x="140.0" y="1252.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">mail, and a push to the phone</text>
  <polyline points="140,1154 140,1210" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <polyline points="240,1238 530,1238 530,1154" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="385" y="1230" text-anchor="middle" font-size="11" fill="#9aa5b1">the dashboards, through SSH</text>
</svg>

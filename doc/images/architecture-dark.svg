  <polyline points="360,1034 360,1090" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="372" y="1067" text-anchor="start" font-size="11" fill="#9aa5b1">HTTPS, basic auth</text>

  <polyline points="360.0,764 360.0,860" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="372.0" y="816.0" text-anchor="start" font-size="11" fill="#9aa5b1">metrics</text>
  <polyline points="460,892 520,892" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="490.0" y="884" text-anchor="middle" font-size="11" fill="#9aa5b1">draws</text>
  <rect x="40" y="980" width="200" height="64" rx="10" fill="#1f2b3d" stroke="#8ab4f8" stroke-width="1.5"/>
  <text x="140.0" y="1007.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">logship</text>

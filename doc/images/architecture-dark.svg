  <rect x="520" y="860" width="280" height="64" rx="10" fill="#3a2a17" stroke="#f6ad55" stroke-width="1.5"/>
  <text x="660.0" y="887.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">CloudWatch dashboard</text>
  <text x="660.0" y="906.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">taskfest-&lt;env&gt;-go-backend</text>
  <polyline points="140.0,764 140.0,860" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>

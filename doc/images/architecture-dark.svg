  <text x="250.0" y="346.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">with CloudFront's secret header</text>
  <rect x="520" y="300" width="280" height="64" rx="10" fill="#1e242a" stroke="#39424b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="660.0" y="327.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">Quarkus on Fargate, RDS</text>
  <text x="660.0" y="346.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">prod, until the cut-over (#557)</text>
  <polyline points="250.0,234 250.0,300" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="262.0" y="271.0" text-anchor="start" font-size="11" fill="#9aa5b1">/api</text>
  <polyline points="430,234 430,267 660.0,267 660.0,300" fill="none" stroke="#9aa5b1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="472" y="259" text-anchor="start" font-size="11" fill="#9aa5b1">or: api_backend = containers</text>
  <rect x="40" y="420" width="420" height="80" rx="10" fill="#1f2b3d" stroke="#8ab4f8" stroke-width="1.5"/>
  <text x="250.0" y="446.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">api · Go on Lambda</text>
  <text x="250.0" y="465.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">every route; the OIDC client, which</text>
  <text x="250.0" y="484.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">exchanges the code with Google itself</text>
  <polyline points="250.0,364 250.0,420" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="262.0" y="396.0" text-anchor="start" font-size="11" fill="#9aa5b1">invokes its alias live</text>
  <rect x="40" y="560" width="200" height="64" rx="10" fill="#3a2a17" stroke="#f6ad55" stroke-width="1.5"/>
  <text x="140.0" y="587.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">S3</text>
  <text x="140.0" y="606.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">attachments · serverless/</text>
  <rect x="260" y="560" width="200" height="64" rx="10" fill="#3a2a17" stroke="#f6ad55" stroke-width="1.5"/>
  <text x="360.0" y="587.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">DynamoDB</text>
  <text x="360.0" y="606.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">one table · TTL · stream</text>
  <polyline points="140.0,500 140.0,560" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="152.0" y="534.0" text-anchor="start" font-size="11" fill="#9aa5b1">signs links</text>
  <polyline points="360.0,500 360.0,560" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="372.0" y="534.0" text-anchor="start" font-size="11" fill="#9aa5b1">reads, writes</text>
  <polyline points="40,98 20,98 20,600 40,600" fill="none" stroke="#8ab4f8" stroke-width="1.6" marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/>
  <text x="40" y="646" text-anchor="start" font-size="12" fill="#8ab4f8">files, both ways: presigned PUT and GET, straight</text>
  <text x="40" y="662" text-anchor="start" font-size="12" fill="#8ab4f8">from the browser and the apps alike</text>
  <rect x="40" y="700" width="200" height="64" rx="10" fill="#1f2b3d" stroke="#8ab4f8" stroke-width="1.5"/>

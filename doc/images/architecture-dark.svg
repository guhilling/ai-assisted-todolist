  <text x="520" y="744" text-anchor="start" font-size="11" fill="#9aa5b1">Every function, api included, and</text>
  <text x="520" y="760" text-anchor="start" font-size="11" fill="#9aa5b1">the HTTP API report metrics and</text>
  <text x="520" y="776" text-anchor="start" font-size="11" fill="#9aa5b1">write their log lines below.</text>

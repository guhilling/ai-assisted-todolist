  <text x="140.0" y="96.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">the SPA</text>
  <rect x="272" y="38" width="200" height="64" rx="10" fill="#1f2b3d" stroke="#8ab4f8" stroke-width="1.5"/>
  <rect x="260" y="50" width="200" height="64" rx="10" fill="#1f2b3d" stroke="#8ab4f8" stroke-width="1.5"/>
  <text x="360.0" y="77.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">iOS and Android apps</text>
  <text x="360.0" y="96.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">one Expo codebase</text>
  <rect x="520" y="50" width="280" height="64" rx="10" fill="#1c3326" stroke="#81c995" stroke-width="1.5"/>
  <text x="660.0" y="77.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">Identity provider</text>
  <text x="660.0" y="96.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">Google</text>
  <polyline points="472,82 520,82" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="496" y="74" text-anchor="middle" font-size="11.5" fill="#9aa5b1">sign in</text>
  <polyline points="140,50 140,22 620,22 620,50" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="380" y="16" text-anchor="middle" font-size="11.5" fill="#9aa5b1">the browser is redirected to sign in</text>
  <rect x="40" y="170" width="420" height="64" rx="10" fill="#3a2a17" stroke="#f6ad55" stroke-width="1.5"/>
  <text x="250.0" y="197.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">CloudFront</text>
  <text x="250.0" y="216.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">the site's files, and /api</text>
  <rect x="520" y="170" width="280" height="64" rx="10" fill="#3a2a17" stroke="#f6ad55" stroke-width="1.5"/>
  <text x="660.0" y="197.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">S3</text>
  <text x="660.0" y="216.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">the site's files</text>
  <polyline points="140,114 140,170" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="150" y="136" text-anchor="start" font-size="12" fill="#8ab4f8">same origin, a session cookie:</text>
  <text x="150" y="152" text-anchor="start" font-size="12" fill="#8ab4f8">the browser never holds a token</text>
  <polyline points="360,114 360,170" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="372" y="136" text-anchor="start" font-size="11" fill="#9aa5b1">ID token</text>
  <text x="372" y="151" text-anchor="start" font-size="11" fill="#9aa5b1">as Bearer</text>
  <polyline points="460,202 520,202" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="40" y="300" width="420" height="64" rx="10" fill="#3a2a17" stroke="#f6ad55" stroke-width="1.5"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1290"
     width="840" height="1290" role="img" aria-label="TaskFest on the Go backend, top to bottom. The browser and the iOS and Android apps sign in with Google: the browser is redirected there, the apps sign in themselves. Both talk only to CloudFront, which serves the site's files from S3 and passes /api to API Gateway's HTTP API with a secret header, or, where api_backend says containers, to the Quarkus backend on Fargate that prod runs until the cut-over. The HTTP API invokes the api function, Go on Lambda, which serves every route and is the OIDC client: it exchanges the code with Google itself, and the browser holds a session cookie, never a token, while the apps send their ID token as a Bearer token. The api function reads and writes one DynamoDB table and signs links to the attachment bucket, so files go straight between the clients and S3. The table's stream feeds the streams function, and EventBridge Scheduler runs orphans and replay. Every log line goes to CloudWatch Logs, where eight alarms watch metrics and log lines and notify an SNS topic, which mails Gunnar and pushes to his phone; a CloudWatch dashboard shows the figures. In qa, a subscription filter also hands every line to logship, which sends it over HTTPS with basic auth to VictoriaLogs and Perses on a shared Hetzner VM, which Gunnar opens through SSH."
     font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

  <text x="140.0" y="1127.5" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">VictoriaLogs · Perses</text>
  <text x="140.0" y="1146.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">a Hetzner VM, shared</text>

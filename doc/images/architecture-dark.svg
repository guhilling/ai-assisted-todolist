  <text x="250.0" y="896.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">every function's log, the API's access log</text>
  <rect x="520" y="850" width="280" height="64" rx="10" fill="#3a2a17" stroke="#f6ad55" stroke-width="1.5"/>

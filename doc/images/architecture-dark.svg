  <text x="140.0" y="746.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">on EventBridge Scheduler</text>
  <rect x="260" y="700" width="200" height="64" rx="10" fill="#1f2b3d" stroke="#8ab4f8" stroke-width="1.5"/>

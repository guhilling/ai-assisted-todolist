<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 420"
     width="1090" height="420" role="img" aria-label="Every change starts from a question rather than a guess, then a failing test, then the change and its documentation in one commit. A pull request must pass Checkstyle, the tests and coverage gate, CodeQL, and the browser end-to-end run before it is squashed onto main. SonarCloud then analyses main, and a failed quality gate becomes a GitHub issue. PIT mutation testing reports but does not block."
     font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6672"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a73e8"/>
    </marker>
  </defs>
  <rect width="1090" height="420" fill="#ffffff"/>
  <rect x="20" y="172" width="150" height="56" rx="10" fill="#f6f8fa" stroke="#d5dbe1" stroke-width="1.5"/>
  <text x="95.0" y="205.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">Ask, don't guess</text>
  <rect x="210" y="172" width="150" height="56" rx="10" fill="#f6f8fa" stroke="#d5dbe1" stroke-width="1.5"/>
  <text x="285.0" y="205.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">Failing test first</text>
  <rect x="400" y="172" width="170" height="56" rx="10" fill="#f6f8fa" stroke="#d5dbe1" stroke-width="1.5"/>
  <text x="485.0" y="195.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">Change + docs</text>
  <text x="485.0" y="214.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6672">in one commit</text>
  <rect x="950" y="172" width="110" height="56" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="1005.0" y="205.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">main</text>
  <polyline points="170,200 210,200" fill="none" stroke="#5b6672" stroke-width="1.6" marker-end="url(#arrow)"/>
  <polyline points="360,200 400,200" fill="none" stroke="#5b6672" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="660" y="56.0" width="240" height="288" rx="12" fill="none" stroke="#d5dbe1" stroke-width="1.5"/>
  <text x="780.0" y="82.0" text-anchor="middle" font-size="12" fill="#5b6672">Every check must pass</text>
  <polyline points="570,200 660,200" fill="none" stroke="#5b6672" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="615" y="190" text-anchor="middle" font-size="11" fill="#5b6672">pull request</text>
  <polyline points="900,200 950,200" fill="none" stroke="#1a73e8" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
  <text x="925" y="190" text-anchor="middle" font-size="11" fill="#1a73e8">squash</text>
  <text x="1005" y="160" text-anchor="middle" font-size="11" fill="#5b6672">SonarCloud gate → issue</text>
  <rect x="675" y="108.0" width="210" height="34" rx="8" fill="#f6f8fa" stroke="#d5dbe1" stroke-width="1.5"/>
  <text x="780.0" y="130.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">Checkstyle + Javadoc</text>
  <rect x="675" y="154.0" width="210" height="34" rx="8" fill="#f6f8fa" stroke="#d5dbe1" stroke-width="1.5"/>
  <text x="780.0" y="176.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">Tests, coverage 95 / 90</text>
  <rect x="675" y="200.0" width="210" height="34" rx="8" fill="#f6f8fa" stroke="#d5dbe1" stroke-width="1.5"/>
  <text x="780.0" y="222.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">CodeQL</text>
  <rect x="675" y="246.0" width="210" height="34" rx="8" fill="#f6f8fa" stroke="#d5dbe1" stroke-width="1.5"/>
  <text x="780.0" y="268.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">End-to-end in a browser</text>
  <rect x="675" y="292.0" width="210" height="34" rx="8" fill="#f6f8fa" stroke="#d5dbe1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="780.0" y="314.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">PIT mutation · reports only</text>
  <polyline points="1005,228 1005,372 95,372 95,228" fill="none" stroke="#5b6672" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="550" y="392" text-anchor="middle" font-size="11.5" fill="#5b6672">Renovate opens the next change; a git tag cuts a release</text>
</svg>

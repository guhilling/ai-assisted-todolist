<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600"
     width="1020" height="600" role="img" aria-label="Three identities, in order of how much they may do. A human IAM admin creates the free foundation once: the VPC, subnets, security groups, IAM, the certificate and the DNS records. A role that same human assumes creates and destroys everything that bills: the database, the load balancer and the Fargate service. Below the line, the only unattended identity is the deploy role, assumed from GitHub Actions through OIDC, which may update the service and the site bucket and cannot create, change or delete any infrastructure. Separately, the task roles are what the container runs as rather than an identity anyone assumes, and a read-only user exists for looking at things."
     font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ab4f8"/>
    </marker>
  </defs>
  <rect width="1020" height="600" fill="#14181c"/>
  <rect x="40" y="40" width="250" height="90" rx="10" fill="#1e242a" stroke="#39424b" stroke-width="1.5"/>
  <text x="165.0" y="71.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">gunnar</text>
  <text x="165.0" y="90.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">IAM admin user · MFA</text>
  <text x="165.0" y="109.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">not the account root user</text>
  <rect x="470" y="40" width="510" height="90" rx="10" fill="#1e242a" stroke="#39424b" stroke-width="1.5"/>
  <text x="725.0" y="71.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">Foundation — free, created once</text>
  <text x="725.0" y="90.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">VPC · subnets · route tables · security groups</text>
  <text x="725.0" y="109.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">IAM · ACM certificate · Route 53 records</text>
  <polyline points="290,85.0 470,85.0" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="380" y="75.0" text-anchor="middle" font-size="11.5" fill="#9aa5b1">creates</text>
  <rect x="40" y="180" width="250" height="90" rx="10" fill="#1e242a" stroke="#39424b" stroke-width="1.5"/>
  <text x="165.0" y="211.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">todolist-&lt;env&gt;-lifecycle</text>
  <text x="165.0" y="230.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">a role gunnar assumes</text>
  <text x="165.0" y="249.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">MFA required</text>
  <rect x="470" y="180" width="510" height="90" rx="10" fill="#1e242a" stroke="#39424b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="725.0" y="211.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">Everything that bills</text>
  <text x="725.0" y="230.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">RDS instance · load balancer · Fargate service</text>
  <text x="725.0" y="249.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">destroyed again when nothing is being demoed</text>
  <polyline points="290,225.0 470,225.0" fill="none" stroke="#9aa5b1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="380" y="215.0" text-anchor="middle" font-size="11.5" fill="#9aa5b1">creates · destroys</text>
  <line x1="30" y1="300" x2="990" y2="300" stroke="#8ab4f8" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="34" y="290" text-anchor="start" font-size="11.5" fill="#9aa5b1">above — a person at a terminal; prod needs an approval</text>
  <text x="34" y="322" text-anchor="start" font-size="12" fill="#8ab4f8">below — unattended, and cannot create, change or delete infrastructure</text>
  <rect x="40" y="340" width="250" height="90" rx="10" fill="#1f2b3d" stroke="#8ab4f8" stroke-width="1.5"/>
  <text x="165.0" y="371.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">todolist-&lt;env&gt;-deploy</text>
  <text x="165.0" y="390.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">GitHub Actions, via OIDC</text>
  <text x="165.0" y="409.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">no stored credential</text>
  <rect x="470" y="340" width="510" height="90" rx="10" fill="#1e242a" stroke="#39424b" stroke-width="1.5"/>
  <text x="725.0" y="371.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">Redeploy only</text>
  <text x="725.0" y="390.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">task definition · service · migration task</text>
  <text x="725.0" y="409.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">frontend artifact → site bucket</text>
  <polyline points="290,385.0 470,385.0" fill="none" stroke="#8ab4f8" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
  <text x="380" y="375.0" text-anchor="middle" font-size="11.5" fill="#8ab4f8">updates</text>
  <rect x="40" y="470" width="250" height="84" rx="10" fill="#1e242a" stroke="#39424b" stroke-width="1.5"/>
  <text x="165.0" y="498.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">todolist-monitoring</text>
  <text x="165.0" y="517.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">read-only, everywhere</text>
  <text x="165.0" y="536.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">a person at a console</text>
  <rect x="470" y="470" width="510" height="84" rx="10" fill="#1e242a" stroke="#39424b" stroke-width="1.5"/>
  <text x="725.0" y="498.0" text-anchor="middle" font-size="13" font-weight="600" fill="#e6eaee">todolist-&lt;env&gt;-task-execution · -task</text>
  <text x="725.0" y="517.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">what the container runs as — nobody assumes these</text>
  <text x="725.0" y="536.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#9aa5b1">pulls the image, reads the database secret, writes logs</text>
  <polyline points="725,430 725,470" fill="none" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="738" y="452" text-anchor="start" font-size="11.5" fill="#9aa5b1">iam:PassRole — only these two, only to ECS</text>
</svg>

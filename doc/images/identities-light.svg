<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470"
     width="1020" height="470" role="img" aria-label="Two identities, in order of how much they may do. A human IAM admin creates and changes everything by an apply: the table, the buckets, the functions, the HTTP API, the distribution, IAM, the certificate and the DNS records. Below the line, the only unattended identity is the deploy role, assumed from GitHub Actions through OIDC, which may deploy the Go backend's code and the site bucket and cannot create, change or delete any infrastructure. Separately, the function roles are what the Go backend's functions run as rather than an identity anyone assumes. A read-only user exists for looking at things."
     font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6672"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a73e8"/>
    </marker>
  </defs>
  <rect width="1020" height="470" fill="#ffffff"/>
  <rect x="40" y="40" width="250" height="90" rx="10" fill="#f6f8fa" stroke="#d5dbe1" stroke-width="1.5"/>
  <text x="165.0" y="71.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">gunnar</text>
  <text x="165.0" y="90.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6672">IAM admin user · MFA</text>
  <text x="165.0" y="109.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6672">not the account root user</text>
  <rect x="470" y="40" width="510" height="90" rx="10" fill="#f6f8fa" stroke="#d5dbe1" stroke-width="1.5"/>
  <text x="725.0" y="71.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">Everything, by an apply</text>
  <text x="725.0" y="90.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6672">table · buckets · functions · HTTP API · distribution</text>
  <text x="725.0" y="109.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6672">IAM · ACM certificate · Route 53 records</text>
  <polyline points="290,85.0 470,85.0" fill="none" stroke="#5b6672" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="380" y="75.0" text-anchor="middle" font-size="11.5" fill="#5b6672">creates · changes</text>
  <line x1="30" y1="160" x2="990" y2="160" stroke="#1a73e8" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="34" y="150" text-anchor="start" font-size="11.5" fill="#5b6672">above — a person at a terminal</text>
  <text x="34" y="182" text-anchor="start" font-size="12" fill="#1a73e8">below — unattended, and cannot create, change or delete infrastructure</text>
  <rect x="40" y="200" width="250" height="90" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="165.0" y="231.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">taskfest-&lt;env&gt;-deploy</text>
  <text x="165.0" y="250.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6672">GitHub Actions, via OIDC</text>
  <text x="165.0" y="269.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6672">no stored credential</text>
  <rect x="470" y="200" width="510" height="90" rx="10" fill="#f6f8fa" stroke="#d5dbe1" stroke-width="1.5"/>
  <text x="725.0" y="231.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">Redeploy only</text>
  <text x="725.0" y="250.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6672">the Go backend's code · its alias live</text>
  <text x="725.0" y="269.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6672">frontend artifact → site bucket</text>
  <polyline points="290,245.0 470,245.0" fill="none" stroke="#1a73e8" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
  <text x="380" y="235.0" text-anchor="middle" font-size="11.5" fill="#1a73e8">updates</text>
  <rect x="40" y="340" width="250" height="84" rx="10" fill="#f6f8fa" stroke="#d5dbe1" stroke-width="1.5"/>
  <text x="165.0" y="368.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">taskfest-monitoring</text>
  <text x="165.0" y="387.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6672">read-only, everywhere</text>
  <text x="165.0" y="406.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6672">a person at a console</text>
  <rect x="470" y="340" width="510" height="84" rx="10" fill="#f6f8fa" stroke="#d5dbe1" stroke-width="1.5"/>
  <text x="725.0" y="368.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1f24">taskfest-&lt;env&gt;-api · -streams · -orphans · …</text>
  <text x="725.0" y="387.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6672">what the functions run as — nobody assumes these</text>
  <text x="725.0" y="406.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5b6672">each may make only the calls its function makes</text>
</svg>

appId: com.apple.mobileslideshow
---
- launchApp
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: photos-1-library
- tapOn:
    point: 15%, 75%
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: photos-2-photo
- tapOn:
    text: "Share"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: photos-3-sheet

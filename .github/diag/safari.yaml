appId: com.apple.mobilesafari
---
- launchApp
- openLink:
    link: https://example.com
    browser: true
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    point: 90%, 71%
    optional: true
- waitForAnimationToEnd
- takeScreenshot: safari-1-page
- tapOn:
    text: "More"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: safari-2-menu
- tapOn:
    text: "Share"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: safari-3-sheet

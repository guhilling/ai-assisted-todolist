appId: com.apple.mobilesafari
---
- launchApp
- openLink:
    link: https://example.com
    browser: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: safari-1-page
- tapOn:
    text: "Share"
    optional: true
- tapOn:
    id: "ShareButton"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: safari-2-sheet
- swipe:
    direction: LEFT
    start: 80%, 55%
    end: 10%, 55%
    optional: true
- takeScreenshot: safari-3-swiped
- tapOn:
    text: "More"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: safari-4-more

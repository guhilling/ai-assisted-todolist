name: Release

# The git tag is the only place a release version is written down. Nothing in package.json or
# go.mod is edited by hand or by this workflow: the Go backend is told its version from the tag at
# build time, and the frontend package is private and never published, so its version field is
# unused.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Started for a tag by cut-release.yml (#297): the tag it pushes with its own token starts no
  # workflow by itself. Started by hand, it must be for a release tag too, which gate checks.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Release checks
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          # merge-base below needs history, not just the tagged commit.
          fetch-depth: 0

      - name: Derive the version from the tag
        id: version
        # A push matches the trigger's tag patterns already; a start from the Actions tab may name
        # any branch or tag, and only a release tag is one. A pre-release's suffix is dot-separated
        # letters and digits, as the deploy workflows also insist (#433): the version reaches shell
        # commands. Whether it is a pre-release is decided here, once, for every job.
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::A release is made for a tag vX.Y.Z, not for $GITHUB_REF_NAME."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $version from tag $GITHUB_REF_NAME"

      - name: Refuse a tag that is already released
        # A pushed tag cannot be pushed again, but release.yml can be started again for one from the
        # Actions tab: it would then build the released version's artifacts again and fail only once
        # announce found the Release there. A failed release is retried by deleting its Release and
        # its tag first, as "If a release fails" in doc/releasing.md says. Only a lookup GitHub
        # answers with 404 means "not released": any other failure stops the release too.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > /dev/null 2> "$RUNNER_TEMP/lookup.err"; then
            echo "::error::$GITHUB_REF_NAME is released already."
            exit 1
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/lookup.err"; then
            echo "::error::Could not find out whether $GITHUB_REF_NAME is released already: $(cat "$RUNNER_TEMP/lookup.err")"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is not released yet."

      - name: Refuse a lightweight tag
        # An annotated tag says who tagged, when and why (#333); `git tag -a` makes one, cut-release.yml
        # too. origin is asked rather than the checkout, which need not keep the tag object: for an
        # annotated tag ls-remote lists a second, peeled line (`^{}`, asked for by name) with the
        # commit the tag names, for a lightweight one it does not. The commit must be the one checked
        # out, which a re-run of an old run's need not be.
        run: |
          tags=$(git ls-remote --tags origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}")
          if [ -z "$tags" ]; then
            echo "::error::$GITHUB_REF_NAME is not on origin any more."
            exit 1
          fi
          target=$(awk -v peeled="refs/tags/$GITHUB_REF_NAME^{}" '$2 == peeled { print $1 }' <<< "$tags")
          if [ -z "$target" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag. Tag with git tag -a, as doc/releasing.md says."
            exit 1
          fi
          built=$(git rev-parse 'HEAD^{commit}')
          if [ "$target" != "$built" ]; then
            echo "::error::$GITHUB_REF_NAME now names $target, not $built, which this run builds."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is an annotated tag of $built."

      - name: Refuse a tag that is not on main
        # A tag on a side branch would publish code that never went through a pull request.
        # main is fetched explicitly rather than relying on the checkout of a tag ref
        # having left a usable origin/main behind.
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main."

      - name: Write the API contract at the release version
        # The committed doc/api says 1.0.0-SNAPSHOT, which is what main's version permanently is.
        # generate.py --version writes the tag's version into the documents, so the contract
        # attached to the release claims the version it describes. It dirties the working tree,
        # which does not matter: nothing commits from this job.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pip install -r doc/api/requirements.txt
          python3 doc/api/generate.py --version "$VERSION"

      - name: Upload the API contract
        uses: actions/upload-artifact@v7
        with:
          name: api-contract
          path: doc/api

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore npm's cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-frontend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('npm-frontend-{0}-{1}-', runner.os, runner.arch) || '' }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Refuse pre-release npm dependencies
        working-directory: frontend
        # A pre-release dependency must not reach a release; see the script's own comment.
        run: npm run check:deps

      - name: Verify the frontend
        working-directory: frontend
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # The version goes to the build alone: the footer shows it, and the build is the release
        # artifact. Set for the whole step it reached the tests too, and the one that checks a
        # build without it says "Development build" failed the v0.7.2 release.
        run: |
          npm run lint
          npm run test:coverage
          VITE_TASKFEST_VERSION="$VERSION" npm run build

      - name: Package the frontend build
        # The built SPA is a release artifact, synced into an environment's site bucket by
        # deploy-frontend.yml -- built once here and never rebuilt at deploy time, which is what
        # makes rolling back the frontend "deploy the previous release" (doc/deployment/deploying.md).
        # The archive holds the contents of dist/, not the directory.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: tar -czf "taskfest-frontend-$VERSION.tar.gz" -C frontend/dist .

      - name: Upload the frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: taskfest-frontend-${{ steps.version.outputs.version }}.tar.gz

  # The Go backend's five functions (#555, #508), built once from the tag and attached to the release,
  # as the frontend build is: deploy-serverless.yml deploys these zips, never a rebuild, which is
  # what makes a rollback "deploy the previous release". The version is the tag's, which
  # GET /api/version reports.
  serverless:
    name: Build the Go backend
    needs: gate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: serverless/go.mod
          # Off, as in Serverless CI: caches are saved on main only (#308).
          cache: false

      # Serverless CI runs these on pull requests, but only when the Go backend or the contract
      # changes, and main requires no status check: so the tag's own commit is checked here before
      # anything is built from it, as the gate re-runs the frontend's suite (doc/releasing.md).
      - name: The generated code is current
        working-directory: serverless
        run: |
          go generate ./...
          # --intent-to-add, or a new generated file would be untracked and invisible to git diff;
          # against HEAD, or one the generator deleted would be staged and invisible too (#611).
          git add --all --intent-to-add .
          git diff --exit-code HEAD -- . || {
            echo "::error::generated code is stale (api.gen.go, zones.gen.go): run go generate ./... in serverless/"
            exit 1
          }
      - name: Vet
        working-directory: serverless
        run: go vet ./...
      - name: Test
        # DynamoDB Local and LocalStack start through Testcontainers, in the runner's Docker.
        working-directory: serverless
        run: go test -race ./...

      - name: Build the functions
        env:
          TASKFEST_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          serverless/build.sh
          mkdir serverless-build
          for c in api streams orphans replay logship; do
            cp "serverless/dist/$c.zip" "serverless-build/taskfest-serverless-$TASKFEST_VERSION-$c.zip"
          done
          ls -la serverless-build

      - name: Upload the functions
        uses: actions/upload-artifact@v7
        with:
          name: serverless-build
          path: serverless-build/*.zip

  announce:
    name: GitHub Release
    needs: [gate, serverless]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # To ask pages.yml to rebuild the published site, below.
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the API contract
        uses: actions/download-artifact@v8
        with:
          name: api-contract
          path: api-contract

      - name: Download the frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend-build

      - name: Download the Go backend's functions
        uses: actions/download-artifact@v8
        with:
          name: serverless-build
          path: serverless-build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        # --verify-tag refuses to invent a tag if the ref has gone; --generate-notes builds the
        # body from the pull requests merged since the previous *final* release, named rather than
        # left to GitHub (#433), so a final release's notes cover its pre-releases too. A
        # pre-release is marked as one, which GitHub never makes the repository's latest.
        run: |
          flags=()
          # The newest final release below this one, by version: GNU sort -V puts v1.3.0-rc.1
          # below v1.3.0.
          mapfile -t finals < <(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          previous=$(printf '%s\n' "${finals[@]}" "$GITHUB_REF_NAME" | sort -V -u | grep -B1 -x -- "$GITHUB_REF_NAME" | head -1)
          if [[ -n "$previous" && "$previous" != "$GITHUB_REF_NAME" ]]; then
            flags+=(--notes-start-tag "$previous")
          fi
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes \
            ${flags[@]+"${flags[@]}"}

      - name: Attach the API contract to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Individually rather than as an archive, so every document has a direct download URL
        # that can be cited. The basenames are already unique, so the schema/ nesting is lost
        # without collision -- and the relative $refs between the schemas still resolve,
        # because they name siblings.
        run: >
          gh release upload "$GITHUB_REF_NAME"
          api-contract/openapi.yaml
          api-contract/openapi.json
          api-contract/schema/*.schema.json

      - name: Attach the frontend build to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" frontend-build/taskfest-frontend-*.tar.gz

      - name: Attach the Go backend's functions to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" serverless-build/taskfest-serverless-*.zip

      - name: Publish the new version on Pages
        env:
          GH_TOKEN: ${{ github.token }}
        # On main, not on this tag. The github-pages environment permits deployments from the
        # branch main alone, so a deploy triggered by the release event -- whose ref is
        # refs/tags/v1.2.3 -- would be refused before its first step. Dispatching on main instead
        # keeps every deployment coming from main, and the tag is already in history by now, so
        # build-api-site.py picks the new version up.
        run: gh workflow run pages.yml --ref main

  # Every final release goes to the testers as an app too, qa's and prod's builds alike (#276) --
  # once it is released, so a release that fails on the way never reaches a phone. A pre-release
  # is not built: the stores take three numbers for a version, nothing more. The store
  # credentials are app-stores environment secrets: named here so the called jobs may read them,
  # though this job has no values to give (mobile-release.yml says why).
  mobile:
    name: Mobile apps
    needs: [gate, announce]
    if: ${{ needs.gate.outputs.prerelease == 'false' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mobile-release.yml
    secrets:
      ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

  # Every final release goes to qa; prod only ever by hand, through its protected environment.
  # Pre-releases (v1.2.3-rc.1) are deployed by hand when wanted.
  # The Go backend first, and the frontend only once it is deployed: a backend deploy that fails
  # does not put its frontend in front of the old API. The functions are there whether qa is up or not,
  # and qa serves /api/* from them since #557.
  deploy-serverless-qa:
    name: Deploy the Go backend to qa
    needs: [gate, announce]
    if: ${{ needs.gate.outputs.prerelease == 'false' }}
    permissions:
      contents: read
      id-token: write
      # What deploy-serverless.yml's live-test job may ask for, though a release leaves it off: a
      # called workflow's jobs may not request more than the caller grants, skipped or not.
      actions: read
      packages: read
    uses: ./.github/workflows/deploy-serverless.yml
    with:
      environment: qa
      version: ${{ github.ref_name }}

  deploy-frontend-qa:
    name: Deploy frontend to qa
    # After the Go backend, so its live tests check the release's frontend against the release's
    # API.
    needs: deploy-serverless-qa
    permissions:
      contents: read
      id-token: write
      # The live tests' app job (#278): to download the released app, an artifact of the
      # release's run, and to read the emulator's cached setup. A called workflow's jobs get no
      # more than this.
      actions: read
      packages: read
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: qa
      version: ${{ github.ref_name }}

  # The site's videos page shows the newest live run's recordings (pages.yml). Those of a release
  # are made by the live tests inside deploy-frontend-qa, and pages.yml's own workflow_run trigger
  # never sees them: a release started by cut-release.yml is started with that workflow's token,
  # and a run started so sets off no workflow_run when it completes. So the release asks for the
  # rebuild itself once its live tests are over, passed or not -- the site is rebuilt from
  # scratch, and an artifact is listed as soon as it is uploaded, before this run ends.
  republish-site:
    name: Publish the live run's videos on Pages
    needs: deploy-frontend-qa
    if: ${{ !cancelled() && needs.deploy-frontend-qa.result != 'skipped' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Rebuild the site on main
        env:
          GH_TOKEN: ${{ github.token }}
        # On main, as the announce job's run above, for the same reason.
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"

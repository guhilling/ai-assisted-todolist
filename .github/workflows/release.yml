name: Release

# The git tag is the only place a release version is written down. Nothing in pom.xml or
# package.json is edited by hand or by this workflow: the backend's version is the
# ${revision} property, which is overridden from the tag here, and the frontend package is
# private and never published, so its version field is unused.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Started for a tag by cut-release.yml (#297): the tag it pushes with its own token starts no
  # workflow by itself. Started by hand, it must be for a release tag too, which gate checks.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Release checks
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # merge-base below needs history, not just the tagged commit.
          fetch-depth: 0

      - name: Derive the version from the tag
        id: version
        # A push matches the trigger's tag patterns already; a start from the Actions tab may name
        # any branch or tag, and only a release tag is one. A pre-release's suffix is letters, digits
        # and dots, as the deploy workflows also insist (#433): the version reaches shell commands.
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::A release is made for a tag vX.Y.Z, not for $GITHUB_REF_NAME."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version from tag $GITHUB_REF_NAME"

      - name: Refuse a tag that is already released
        # A pushed tag cannot be pushed again, but release.yml can be started again for one from the
        # Actions tab: publish would then push new images over the released version's before
        # announce found the Release there. A failed release is retried by deleting its Release and
        # its tag first, as "If a release fails" in doc/releasing.md says. Only a lookup GitHub
        # answers with 404 means "not released": any other failure stops the release too.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > /dev/null 2> "$RUNNER_TEMP/lookup.err"; then
            echo "::error::$GITHUB_REF_NAME is released already."
            exit 1
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/lookup.err"; then
            echo "::error::Could not find out whether $GITHUB_REF_NAME is released already: $(cat "$RUNNER_TEMP/lookup.err")"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is not released yet."

      - name: Refuse a lightweight tag
        # An annotated tag says who tagged, when and why (#333); `git tag -a` makes one, cut-release.yml
        # too. origin is asked rather than the checkout, which need not keep the tag object: for an
        # annotated tag ls-remote lists a second, peeled line (`^{}`, asked for by name) with the
        # commit the tag names, for a lightweight one it does not. The commit must be the one checked
        # out, which a re-run of an old run's need not be.
        run: |
          tags=$(git ls-remote --tags origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}")
          if [ -z "$tags" ]; then
            echo "::error::$GITHUB_REF_NAME is not on origin any more."
            exit 1
          fi
          target=$(awk -v peeled="refs/tags/$GITHUB_REF_NAME^{}" '$2 == peeled { print $1 }' <<< "$tags")
          if [ -z "$target" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag. Tag with git tag -a, as doc/releasing.md says."
            exit 1
          fi
          built=$(git rev-parse 'HEAD^{commit}')
          if [ "$target" != "$built" ]; then
            echo "::error::$GITHUB_REF_NAME now names $target, not $built, which this run builds."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is an annotated tag of $built."

      - name: Refuse a tag that is not on main
        # A tag on a side branch would publish code that never went through a pull request.
        # main is fetched explicitly rather than relying on the checkout of a tag ref
        # having left a usable origin/main behind.
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main."

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore Maven's cache
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('maven-{0}-{1}-', runner.os, runner.arch) || '' }}

      - name: Verify the backend at the release version
        working-directory: backend
        # -Prelease adds requireReleaseVersion to the requireReleaseDeps rule that every
        # build runs, so this fails on a SNAPSHOT dependency and on a SNAPSHOT version.
        # verify then runs the tests, the coverage gate, Checkstyle and PIT. It also writes
        # target/openapi (quarkus.smallrye-openapi.store-schema-directory), which the next
        # step turns into the contract announce attaches to the GitHub Release.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./mvnw -B -Prelease -Drevision="$VERSION" verify

      - name: Regenerate the API contract at the release version
        # The committed doc/api says 1.0.0-SNAPSHOT, because that is what main's revision
        # permanently is. Regenerating here, after a build that overrode the revision from the
        # tag, is what makes the attached spec claim the version it actually describes. It
        # dirties the working tree, which does not matter: nothing commits from this job.
        run: python3 doc/api/generate.py

      - name: Upload the API contract
        uses: actions/upload-artifact@v7
        with:
          name: api-contract
          path: doc/api

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore npm's cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-frontend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('npm-frontend-{0}-{1}-', runner.os, runner.arch) || '' }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Refuse pre-release npm dependencies
        working-directory: frontend
        # npm's counterpart to requireReleaseDeps; see the script's own comment.
        run: npm run check:deps

      - name: Verify the frontend
        working-directory: frontend
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # The version goes to the build alone: the footer shows it, and the build is the release
        # artifact. Set for the whole step it reached the tests too, and the one that checks a
        # build without it says "Development build" failed the v0.7.2 release.
        run: |
          npm run lint
          npm run test:coverage
          VITE_TASKFEST_VERSION="$VERSION" npm run build

      - name: Package the frontend build
        # The built SPA is a release artifact, synced into an environment's site bucket by
        # deploy-frontend.yml -- built once here and never rebuilt at deploy time, which is what
        # makes rolling back the frontend "deploy the previous release" (doc/deployment/deploying.md).
        # The archive holds the contents of dist/, not the directory.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: tar -czf "taskfest-frontend-$VERSION.tar.gz" -C frontend/dist .

      - name: Upload the frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: taskfest-frontend-${{ steps.version.outputs.version }}.tar.gz

  publish:
    name: Publish ${{ matrix.name }} image
    needs: gate
    runs-on: ubuntu-26.04
    env:
      # Every platform the images are published for (#249), in one place for both and the check.
      PLATFORMS: linux/amd64,linux/arm64
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    defaults:
      run:
        working-directory: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USER || secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD || secrets.QUAY_ROBOT_TOKEN || secrets.QUAY_PASSWORD }}

      - uses: actions/setup-java@v6
        if: matrix.name == 'backend'
        with:
          distribution: temurin
          java-version: '25'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore Maven's cache
        id: maven-cache
        if: matrix.name == 'backend'
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('maven-{0}-{1}-', runner.os, runner.arch) || '' }}

      - name: Publish the backend image
        if: matrix.name == 'backend'
        env:
          # application.properties reads the tag from here.
          IMAGE_TAG: ${{ needs.gate.outputs.version }}
        # Jib cannot retry a base image download that breaks off; the script can, and only that.
        run: >
          $GITHUB_WORKSPACE/.github/scripts/retry-on-broken-download.sh
          ./mvnw -B -Prelease -Drevision="$IMAGE_TAG"
          package -DskipTests
          -Dquarkus.container-image.build=true
          -Dquarkus.container-image.push=true
          -Dquarkus.jib.platforms="$PLATFORMS"

      - name: Publish the frontend image
        if: matrix.name == 'frontend'
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: >
          docker buildx build --push
          --platform "$PLATFORMS"
          --tag "quay.io/ghilling/taskfest-frontend:$VERSION"
          --build-arg "VITE_TASKFEST_VERSION=$VERSION"
          -f docker/Dockerfile .

      # The tag must be one image index with every platform built (#249), or a machine of the
      # missing one pulls nothing it can run.
      - name: Check the image is published for every platform
        working-directory: .
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: >
          python3 .github/scripts/check-image-platforms.py
          "quay.io/ghilling/taskfest-${{ matrix.name }}:$VERSION" "$PLATFORMS"

  announce:
    name: GitHub Release
    needs: [gate, publish]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # To ask pages.yml to rebuild the published site, below.
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the API contract
        uses: actions/download-artifact@v8
        with:
          name: api-contract
          path: api-contract

      - name: Download the frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend-build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        # --verify-tag refuses to invent a tag if the ref has gone; --generate-notes builds
        # the body from the pull requests merged since the previous release. A pre-release is
        # marked as one and never made the repository's latest (#433): it would otherwise be, and
        # its final release's notes would list only what came after it.
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes \
            "${prerelease[@]}"

      - name: Attach the API contract to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Individually rather than as an archive, so every document has a direct download URL
        # that can be cited. The basenames are already unique, so the schema/ nesting is lost
        # without collision -- and the relative $refs between the schemas still resolve,
        # because they name siblings.
        run: >
          gh release upload "$GITHUB_REF_NAME"
          api-contract/openapi.yaml
          api-contract/openapi.json
          api-contract/schema/*.schema.json

      - name: Attach the frontend build to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" frontend-build/taskfest-frontend-*.tar.gz

      - name: Publish the new version on Pages
        env:
          GH_TOKEN: ${{ github.token }}
        # On main, not on this tag. The github-pages environment permits deployments from the
        # branch main alone, so a deploy triggered by the release event -- whose ref is
        # refs/tags/v1.2.3 -- would be refused before its first step. Dispatching on main instead
        # keeps every deployment coming from main, and the tag is already in history by now, so
        # build-api-site.py picks the new version up.
        run: gh workflow run pages.yml --ref main

  # Every final release goes to the testers as an app too, qa's and prod's builds alike (#276) --
  # once it is released, so a release that fails on the way never reaches a phone. A pre-release
  # is not built: the stores take three numbers for a version, nothing more. The store
  # credentials are app-stores environment secrets: named here so the called jobs may read them,
  # though this job has no values to give (mobile-release.yml says why).
  mobile:
    name: Mobile apps
    needs: announce
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mobile-release.yml
    secrets:
      ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

  # Every final release goes to qa; prod only ever by hand, through its protected environment.
  # Pre-releases (v1.2.3-rc.1) are deployed by hand when wanted: `env.sh up qa` starts the newest
  # *final* release, so one deployed automatically would quietly be undone by a down/up cycle.
  # The backend first, and the frontend only once it serves: a release that changes the database
  # changelog takes the downtime path (#215) and then gets its own frontend, so qa ends on one
  # version; a backend deploy that fails does not put its frontend in front of the old API. When qa
  # is down the backend is skipped without failing and the frontend is still uploaded, since the
  # site bucket outlives `down`.
  deploy-backend-qa:
    name: Deploy backend to qa
    needs: announce
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      id-token: write
      # The live tests' app job (#278): to download the released app, an artifact of the
      # release's run, and to read the emulator's cached setup. A called workflow's jobs get no
      # more than this.
      actions: read
      packages: read
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: qa
      version: ${{ github.ref_name }}

  deploy-frontend-qa:
    name: Deploy frontend to qa
    needs: deploy-backend-qa
    permissions:
      contents: read
      id-token: write
      # The live tests' app job (#278): to download the released app, an artifact of the
      # release's run, and to read the emulator's cached setup. A called workflow's jobs get no
      # more than this.
      actions: read
      packages: read
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: qa
      version: ${{ github.ref_name }}

  # The site's videos page shows the newest live run's recordings (pages.yml). Those of a release
  # are made by the live tests inside deploy-frontend-qa, and pages.yml's own workflow_run trigger
  # never sees them: a release started by cut-release.yml is started with that workflow's token,
  # and a run started so sets off no workflow_run when it completes. So the release asks for the
  # rebuild itself once its live tests are over, passed or not -- the site is rebuilt from
  # scratch, and an artifact is listed as soon as it is uploaded, before this run ends.
  republish-site:
    name: Publish the live run's videos on Pages
    needs: deploy-frontend-qa
    if: ${{ !cancelled() && needs.deploy-frontend-qa.result != 'skipped' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Rebuild the site on main
        env:
          GH_TOKEN: ${{ github.token }}
        # On main, as the announce job's run above, for the same reason.
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"

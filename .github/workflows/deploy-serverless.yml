name: Deploy Go backend

# Deploys a release's Go backend to an environment (#555): the four function zips release.yml built
# once and attached to the release, never a rebuild. deploy-serverless.py uploads each, publishes it
# as a version, checks the API's new version, and moves each function's alias `live` to it.
#
# Started by hand with an environment and a release tag -- which is also how the Go backend is
# rolled back: run it with the previous tag -- or called by release.yml for qa after every release.
# Unlike the containers, the functions are there whether the environment is up or not, so there is
# nothing to skip.
#
# The AWS identity is the environment's deploy role, assumed through GitHub's OIDC token, so no
# key is stored anywhere. The role trusts only a job running in the GitHub environment of the
# same name, which is why the job declares `environment:` -- for prod, that environment's
# protection rule is the approval gate.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [qa, prod]
        required: true
      version:
        description: Release tag to deploy, e.g. v1.6.0
        type: string
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read
  # For the OIDC token the deploy role is assumed with.
  id-token: write

concurrency:
  # One rollout per environment at a time; a second waits rather than racing the first's aliases.
  group: deploy-serverless-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the Go backend to ${{ inputs.environment }}
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Refuse anything but a release tag
        # The input reaches a shell and a download; only the shape release.yml publishes gets in.
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::'$VERSION' is not a release tag like v1.2.3"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Download the release's functions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "taskfest-serverless-${VERSION#v}-*.zip" --dir release
          ls -la release

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          # The deploy role's ARN is not a secret: what protects it is its trust policy, which
          # names this repository and this GitHub environment.
          role-to-assume: arn:aws:iam::808706946095:role/taskfest-${{ inputs.environment }}-deploy
          aws-region: eu-central-1

      - name: Deploy the functions
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: python3 .github/scripts/deploy-serverless.py --environment "$ENVIRONMENT" --version "$VERSION" --dist release

      - name: Say what was deployed
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: echo "### Go backend $VERSION deployed to $ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"

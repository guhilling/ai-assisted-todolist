name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'deployment/docker/docker-compose.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'deployment/docker/docker-compose.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore Maven's cache
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('maven-{0}-{1}-', runner.os, runner.arch) || '' }}
      - name: Check code style
        run: ./mvnw -B checkstyle:check
      - name: Run tests, enforce coverage and build the container image
        # verify runs the tests, packages the artifact, and fails the build if JaCoCo
        # coverage drops below the minimum in pom.xml. The image is built in the same run,
        # from the package verify has just made: a second `package` used to rebuild it all
        # for the image alone, about 19 s of every backend run (#134).
        # Jib cannot retry a base image download that breaks off; the script can, and only that.
        run: $GITHUB_WORKSPACE/.github/scripts/retry-on-broken-download.sh ./mvnw -B verify -Dquarkus.container-image.build=true
      - name: Upload the mutation testing report
        # Always, not just on failure: PIT reports rather than gating, so this artifact is
        # the only way to see which mutants survived. The build log gives only the total.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-report
          path: backend/target/pit-reports
          retention-days: 7
      - name: Save Maven's cache
        if: github.ref == 'refs/heads/main' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

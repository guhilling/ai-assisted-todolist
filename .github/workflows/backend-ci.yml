name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'docker/docker-compose.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'docker/docker-compose.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check code style
        run: ./mvnw -B checkstyle:check
      - name: Run tests and enforce coverage
        # verify runs the tests, packages the artifact, and fails the build if JaCoCo
        # coverage drops below the minimum in pom.xml.
        run: ./mvnw -B verify
      - name: Build backend container image
        run: ./mvnw -B package -DskipTests -Dquarkus.container-image.build=true

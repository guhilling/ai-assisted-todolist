name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'doc/api/**'
      - '.github/workflows/backend-ci.yml'
      - 'deployment/docker/docker-compose.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'doc/api/**'
      - '.github/workflows/backend-ci.yml'
      - 'deployment/docker/docker-compose.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check code style
        run: ./mvnw -B checkstyle:check
      - name: Run tests, enforce coverage and build the container image
        # verify runs the tests, packages the artifact, and fails the build if JaCoCo
        # coverage drops below the minimum in pom.xml. The image is built in the same run,
        # from the package verify has just made: a second `package` used to rebuild it all
        # for the image alone, about 19 s of every backend run (#134).
        run: ./mvnw -B verify -Dquarkus.container-image.build=true
      - name: Check the committed API contract is current
        working-directory: .
        # verify has just written target/openapi. Regenerating and diffing is what keeps
        # doc/api honest: the frontend generates its response validators from those files, so a
        # stale contract there means a validator that checks the wrong shape.
        run: |
          python3 doc/api/generate.py
          # --intent-to-add first, or a brand new schema file would be untracked and so
          # invisible to git diff -- the one case the gate most needs to catch.
          git add --all --intent-to-add doc/api
          git diff --exit-code doc/api || {
            echo "::error::doc/api is out of date. Run: cd backend && ./mvnw -B package -DskipTests && python3 doc/api/generate.py"
            exit 1
          }

      - name: Fetch the API of the oldest supported release
        working-directory: .
        # Installed mobile apps are weeks behind the backend (#268), so the API must keep serving
        # them. doc/api/oldest-supported-release names the oldest release it still has to serve.
        run: |
          baseline=$(grep -v '^#' doc/api/oldest-supported-release | tr -d '[:space:]')
          git fetch --no-tags --depth=1 origin "refs/tags/$baseline:refs/tags/$baseline"
          mkdir -p "$GITHUB_WORKSPACE/.oasdiff"
          git show "$baseline:doc/api/openapi.yaml" > "$GITHUB_WORKSPACE/.oasdiff/baseline.yaml"
          echo "Comparing with $baseline"

      - name: Check the API breaks nothing that release relies on
        # Errors only: a warning is a change oasdiff cannot judge, such as a new enum value in a
        # response, which an app tolerates by reading unknown values as unknown (doc/releasing.md).
        uses: docker://tufin/oasdiff:v1.33.0
        with:
          args: breaking .oasdiff/baseline.yaml doc/api/openapi.yaml --fail-on ERR

      - name: Upload the mutation testing report
        # Always, not just on failure: PIT reports rather than gating, so this artifact is
        # the only way to see which mutants survived. The build log gives only the total.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-report
          path: backend/target/pit-reports
          retention-days: 7

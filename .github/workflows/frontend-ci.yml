name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'doc/api/**'
      - '.github/workflows/frontend-ci.yml'
      - 'docker/docker-compose.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'doc/api/**'
      - '.github/workflows/frontend-ci.yml'
      - 'docker/docker-compose.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check the generated wire types and validators are current
        # Regenerated from the committed schemas under doc/api, so this needs no backend build.
        # It catches both halves of a drift: a schema change that nobody regenerated against,
        # and a hand-edit of the generated files.
        run: |
          npm run generate:api
          git add --all --intent-to-add src/generated
          git diff --exit-code src/generated || {
            echo "::error::src/generated is out of date. Run: cd frontend && npm run generate:api"
            exit 1
          }

      - name: Lint frontend
        run: npm run lint
      - name: Run tests
        run: npm run test:coverage
      - name: Build frontend
        run: npm run build
      - name: Build frontend container image
        run: docker build -f docker/Dockerfile -t todo-frontend:test .

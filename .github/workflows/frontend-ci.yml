name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'doc/api/**'
      - '.design-sync/conventions.md'
      - '.github/workflows/frontend-ci.yml'
      - 'deployment/docker/docker-compose.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'doc/api/**'
      - '.design-sync/conventions.md'
      - '.github/workflows/frontend-ci.yml'
      - 'deployment/docker/docker-compose.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check the generated wire types and validators are current
        # Regenerated from the committed schemas under doc/api, so this needs no backend build.
        # It catches both halves of a drift: a schema change that nobody regenerated against,
        # and a hand-edit of the generated files.
        run: |
          npm run generate:api
          git add --all --intent-to-add src/generated
          git diff --exit-code src/generated || {
            echo "::error::src/generated is out of date. Run: cd frontend && npm run generate:api"
            exit 1
          }

      - name: Lint frontend
        run: npm run lint
      - name: Run tests
        run: npm run test:coverage
      - name: Build frontend
        run: npm run build

      - name: Build the component library
        # Not covered by `npm run build`, which builds the app. This target exists so the
        # components can be rendered outside the app -- by the design system published from
        # them -- and nothing else here would notice if it broke.
        run: npm run build:ds

      - name: Check the library build produced what a consumer needs
        # An entry, a stylesheet and the declarations, because a bundler resolves the first,
        # a component without the second renders unstyled, and a consumer without the third
        # gets no types. A silent partial build is the failure worth naming.
        run: |
          missing=()
          for artifact in \
            dist-ds/index.js \
            dist-ds/frontend.css \
            dist-ds/design-system.d.ts \
            dist-ds/components/TaskRow.d.ts
          do
            [ -s "$artifact" ] || missing+=("$artifact")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::npm run build:ds did not produce: ${missing[*]}"
            exit 1
          fi
          echo "library build produced its entry, stylesheet and declarations"

      - name: Check the conventions header still names things that exist
        # conventions.md is inlined into the design agent's system prompt, so a class
        # renamed in App.css leaves the agent writing a name that styles nothing. The
        # page still renders -- that is why nothing else catches it.
        run: npm run check:conventions

      - name: Build frontend container image
        run: docker build -f docker/Dockerfile -t taskfest-frontend:test .

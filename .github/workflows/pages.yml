name: API contract on Pages

# Publishes the project documentation and the API contract as a browsable site: doc/ rendered
# as pages, and one directory per version of the contract with the OpenAPI document, the
# per-type JSON Schemas and a rendered reference.
#
# main is published as well as the releases, deliberately. A release-only spec answers what the
# last release promised and never what the code currently does, and there needs to be a way to
# see and consume the contract for the current main -- what a -SNAPSHOT gives you in Maven.
on:
  push:
    branches:
      - main
    paths:
      - 'doc/**'
      - 'README.md'
      - '.github/scripts/**'
      - '.github/workflows/pages.yml'
  # Deliberately *not* `release: published`. A release event runs with github.ref set to
  # refs/tags/v1.2.3, and the github-pages environment permits deployments from the single branch
  # main -- so a deploy reached that way is refused before its first step. release.yml asks this
  # workflow to run on main instead, once the release exists; the tag is already in history by
  # then, so the build below sees it.
  #
  # The site is rebuilt from scratch every run, so a manual run is always safe and is the way to
  # republish after a failed deployment.
  #
  # Note what these triggers mean for reviewing a change to this file: none of them is
  # `pull_request`, so a pull request cannot exercise it, and the deploy job only ever runs on
  # main. That is how this file's first version reached main with a deploy step that could not
  # succeed. A change here is not demonstrated by a green pull request.
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one deployment at a time, and a queued run must finish rather than be cancelled:
# cancelling the deploy job is what leaves the environment stuck in "in progress".
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble the site
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Every released version of the contract is read out of its tag, so the tags and the
          # history behind them have to be here.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install the site generator's dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Build the site
        run: python3 .github/scripts/build-site.py _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    # Only ever from main. Deploying a branch makes no sense -- the site is what main and the
    # release tags say -- and the environment's branch policy refuses it anyway. Skipping rather
    # than failing is what lets `workflow_dispatch` on a branch build the site to check a change
    # to this workflow without leaving a red run behind.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

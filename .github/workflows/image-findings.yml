name: Image findings

# Amazon Inspector scans the backend images ECS pulls through ECR (#162). Every six hours this turns
# what it found into one GitHub issue: fixable HIGH or CRITICAL vulnerabilities in an image ECS
# used in the last 30 days, by Inspector's in-use record or by its arrival in ECR's cache.
# image-findings-issue.py has the policy; doc/deployment/image-scanning.md the whole picture.

on:
  schedule:
    # Every six hours, on the default branch -- which is the only ref the findings role trusts.
    # Reading findings is free and a run takes seconds; more often would only add a mail per
    # failed run during a GitHub outage, for findings that arrive half a day sooner at best.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # image-findings-issue.py opens, updates and closes the issue.
  issues: write
  # The OIDC token traded for the read-only findings role.
  id-token: write

concurrency:
  group: image-findings
  cancel-in-progress: false

jobs:
  findings:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::808706946095:role/taskfest-image-findings
          aws-region: eu-central-1

      - name: Bring the image findings issue up to date
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/image-findings-issue.py

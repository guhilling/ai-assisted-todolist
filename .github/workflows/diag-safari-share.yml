name: Diagnose Safari sharing (throwaway, #380)

on:
  pull_request:
    paths:
      - '.github/workflows/diag-safari-share.yml'
      - '.github/diag-safari/**'

permissions:
  contents: read

jobs:
  safari:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_VARIANT: dev
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Generate the iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios
      - name: Log what the extension is handed
        run: python3 .github/diag-safari/patch.py mobile/ios/expo-sharing-extension/ShareIntoViewController.swift
      - name: Build for the simulator
        working-directory: mobile/ios
        run: |
          set -o pipefail
          workspace=$(ls -d *.xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 20
      - name: Sign with the App Group
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -path '*Release-iphonesimulator/*.app' -maxdepth 6 -type d | head -1)
          echo "APP=$app" >> "$GITHUB_ENV"
          bash .github/scripts/sign-with-app-group.sh "$app" \
            "$(ls mobile/ios/*/*.entitlements | grep -v /expo-sharing-extension/)" \
            mobile/ios/expo-sharing-extension/expo-sharing-extension.entitlements
      - name: Install Maestro
        run: |
          set -a && source mobile/maestro/maestro.env && set +a
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Share a link from Safari
        continue-on-error: true
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return tuple(int(n) for n in re.findall(r"\d+", runtime.rsplit("iOS", 1)[-1]))
          ios = sorted((r for r in devices if ".iOS-" in r), key=version, reverse=True)
          print(next(d["udid"] for r in ios for d in devices[r] if d["name"].startswith("iPhone")))')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$APP"
          echo "START=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          mkdir -p out
          # The control: a photo, which reaches the app.
          maestro --device "$udid" test .github/diag-safari/share-photo.yaml --test-output-dir out || true
          echo "LINK_START=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          xcrun simctl terminate "$udid" de.hilling.taskfest.dev || true
          maestro --device "$udid" test .github/diag-safari/share-link.yaml --test-output-dir out || true
          xcrun simctl io "$udid" screenshot out/final.png || true
      - name: What the extension said
        if: always()
        run: |
          echo "link share from $LINK_START"
          xcrun simctl spawn "$UDID" log show --start "$START" --style compact --info --debug \
            --predicate 'eventMessage CONTAINS "TFDIAG" OR process CONTAINS[c] "expo-sharing" OR eventMessage CONTAINS[c] "expo-sharing" OR eventMessage CONTAINS[c] "de.hilling.taskfest"' \
            > out/extension.log 2>&1 || true
          wc -l out/extension.log
          grep -E "TFDIAG" out/extension.log | cut -c1-400 | head -40
          echo ---- not TFDIAG, after the link share
          awk -v s="$LINK_START" '$0 >= s' out/extension.log | grep -v TFDIAG | grep -iE "expo-sharing|taskfest" | cut -c1-300 | head -60
          # Everything from the link share on, to search afterwards.
          xcrun simctl spawn "$UDID" log show --start "$LINK_START" --style compact --info --debug > out/all-after-link.log 2>&1 || true
          gzip -f out/all-after-link.log
          mkdir -p out/crashes
          cp ~/Library/Logs/DiagnosticReports/*expo* out/crashes/ 2>/dev/null || true
          ls -la ~/Library/Logs/DiagnosticReports/ | tail -10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diag-safari
          path: out
          retention-days: 3

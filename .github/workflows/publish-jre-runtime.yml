name: Publish jre-runtime

# Builds the jre-runtime base image from deployment/jre-runtime/Containerfile (#66). On a pull
# request it only builds and checks it; on main it publishes it, for amd64 and arm64, as
#
#   quay.io/ghilling/jre-runtime:<temurin>-<yyyymmddhhmm>   the tag the backend's Jib build pins
#   quay.io/ghilling/jre-runtime:<temurin>              the newest build of that Temurin release
#   quay.io/ghilling/jre-runtime:<major>                the newest build of that Java major
#
# The Containerfile pins both of its bases by digest and Renovate moves them, so a new image is
# published exactly when one of them changes -- there is no schedule to rebuild the same thing.

on:
  pull_request:
    paths:
      - 'deployment/jre-runtime/**'
      - '.github/workflows/publish-jre-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'deployment/jre-runtime/**'
      - '.github/workflows/publish-jre-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-jre-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jre-runtime:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: deployment/jre-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Work out the tags
        id: tags
        # The Temurin release comes from the Containerfile itself, so the tag cannot disagree with
        # what is inside. Date *and* time make every publish a tag of its own: with the date alone a
        # second publish on one day re-pointed the tag, left the digest the backend pins untagged,
        # and Quay garbage-collects untagged manifests.
        run: |
          temurin=$(sed -n 's|^FROM .*eclipse-temurin:\([^@]*\)-jre-.*|\1|p' Containerfile)
          if [ -z "$temurin" ]; then
            echo "::error::no eclipse-temurin FROM line in Containerfile"
            exit 1
          fi
          {
            echo "temurin=$temurin"
            echo "major=${temurin%%.*}"
            echo "dated=$temurin-$(date -u +%Y%m%d%H%M)"
          } >> "$GITHUB_OUTPUT"

      - name: Build for this runner, and check it
        # What the backend relies on: the JRE runs, and the image really is UBI micro -- no
        # package manager slipped back in with a base change.
        run: |
          docker buildx build -f Containerfile --load -t jre-runtime:check .
          docker run --rm jre-runtime:check java -version
          docker run --rm jre-runtime:check bash -c '! command -v microdnf && ! command -v dnf'

      - name: Log in to Quay
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USER || secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD || secrets.QUAY_ROBOT_TOKEN || secrets.QUAY_PASSWORD }}

      - name: Publish for amd64 and arm64
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build -f Containerfile --platform linux/amd64,linux/arm64 --push \
            --metadata-file metadata.json \
            -t quay.io/ghilling/jre-runtime:${{ steps.tags.outputs.dated }} \
            -t quay.io/ghilling/jre-runtime:${{ steps.tags.outputs.temurin }} \
            -t quay.io/ghilling/jre-runtime:${{ steps.tags.outputs.major }} \
            .
          digest=$(python3 -c "import json;print(json.load(open('metadata.json'))['containerimage.digest'])")
          {
            echo "Published \`quay.io/ghilling/jre-runtime:${{ steps.tags.outputs.dated }}@$digest\`"
            echo
            echo "Jib reference: \`quarkus.jib.base-jvm-image=quay.io/ghilling/jre-runtime:${{ steps.tags.outputs.dated }}@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

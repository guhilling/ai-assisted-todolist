name: End-to-end tests (Go backend)

# The browser suite against the whole stack: the Go backend, the frontend's image and Keycloak
# (docker-compose.e2e.serverless.yml). Until #559 e2e.yml ran it against the Quarkus backend too,
# collected the live checks and saved the caches; this workflow does both now. On amd64 alone: the
# Lambda functions are built for arm64 and tested by Serverless CI.

on:
  pull_request:
    paths:
      - 'serverless/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'keycloak/**'
      - 'deployment/docker/docker-compose.e2e.serverless.yml'
      - '.github/workflows/e2e-serverless.yml'
  push:
    branches: [main]
    paths:
      - 'serverless/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'keycloak/**'
      - 'deployment/docker/docker-compose.e2e.serverless.yml'
      - '.github/workflows/e2e-serverless.yml'

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (Go backend)
    runs-on: ubuntu-26.04
    env:
      # Every `docker compose` below means this stack.
      COMPOSE_FILE: deployment/docker/docker-compose.e2e.serverless.yml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore npm's cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('npm-e2e-{0}-{1}-', runner.os, runner.arch) || '' }}

      - name: Build the frontend image
        working-directory: frontend
        run: docker build -f docker/Dockerfile -t taskfest-frontend:e2e .

      - name: Build the Go backend's image
        # With the toolchain go.mod names, which Serverless CI tests with too.
        run: >
          docker build -t taskfest-serverless:e2e
          --build-arg GO_VERSION="$(sed -n 's/^go \([0-9.]*\).*/\1/p' serverless/go.mod)"
          serverless

      - name: Start the stack
        run: docker compose up -d --wait

      - name: Wait for the frontend
        run: curl -sS --retry 60 --retry-delay 2 --retry-all-errors --fail http://localhost:3000/api/auth/providers

      # The system packages the browser needs, as apt downloaded them: on amd64 Ubuntu's mirror took
      # eight minutes over them, mostly fonts. apt finds them here and downloads only what changed
      # since. Read on every branch, saved from main only, as above.
      - name: Restore the browser's system packages
        id: browser-packages
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: browser-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('browser-packages-{0}-{1}-', runner.os, runner.arch) || '' }}

      - name: Install the end-to-end dependencies
        working-directory: e2e
        run: |
          npm ci
          mkdir -p ~/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/apt-archives" \
            | sudo tee /etc/apt/apt.conf.d/99-browser-packages
          npx playwright install --with-deps chromium
          # apt wrote them as root; the cache is saved as the runner.
          sudo chown -R "$USER" ~/apt-archives

      - name: Collect the live checks
        # They run against a deployed environment, after a deploy (live-tests.yml), not here; but
        # a syntax or import error in them should fail this pull request, not the next release.
        working-directory: e2e
        run: |
          npx playwright test -c playwright.live.config.ts --list
          npx playwright test -c playwright.live-signed-in.config.ts --list
          npx playwright test -c playwright.live-clear.config.ts --list

      - name: Run the end-to-end tests
        working-directory: e2e
        run: npx playwright test

      - name: Collect the stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-serverless
          path: e2e/playwright-report
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down -v
      - name: Save the browser's system packages
        if: github.ref == 'refs/heads/main' && steps.browser-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: ${{ steps.browser-packages.outputs.cache-primary-key }}
      - name: Save npm's cache
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

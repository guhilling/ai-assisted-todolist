name: Terraform CI

# Everything here runs without AWS credentials: formatting, the environment-sameness rule, and
# `validate`, which resolves the module and checks every resource against the provider's own
# schema. There is deliberately no `plan` -- that needs credentials and a state lock, and a plan
# on a pull request would describe changes to a live environment rather than check the code.

on:
  pull_request:
    paths:
      - 'docker/terraform/**'
      - '.github/workflows/terraform-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'docker/terraform/**'
      - '.github/workflows/terraform-ci.yml'

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: docker/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          # Pinned to the version used locally, so a formatting or validation difference is
          # never just a version difference. `terraform fmt` output has changed between minor
          # releases before now.
          terraform_version: '1.5.7'
          # The wrapper turns the CLI into a script that also sets step outputs, which swallows
          # exit codes in a `for` loop below.
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -recursive -check -diff

      - name: Check the environments still differ only in their values
        # The point of the module-plus-thin-root layout is that prod is a parameter change. This
        # is what stops it quietly becoming a second codebase.
        run: python3 check-environments-match.py

      - name: Validate every environment
        # -backend=false skips the S3 backend, which would need credentials. It still downloads
        # the provider, which is what makes the validation meaningful: the resource schemas come
        # from the provider, not from Terraform.
        run: |
          for environment in environments/*/; do
            echo "::group::${environment}"
            terraform -chdir="${environment}" init -backend=false -input=false
            terraform -chdir="${environment}" validate
            echo "::endgroup::"
          done

name: Serverless CI

# The Go backend (#547): the generated contract code, vet, the tests (DynamoDB Local's among them,
# in a container), and the arm64 Lambda build, so a change that would not build for Lambda fails
# here rather than on Gunnar's machine before an apply. It also runs when the contract changes,
# since the Go code is generated from it. Nothing is deployed from here yet (#555).

on:
  pull_request:
    paths:
      - 'serverless/**'
      - 'doc/api/openapi.json'
      - '.github/workflows/serverless-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'serverless/**'
      - 'doc/api/openapi.json'
      - '.github/workflows/serverless-ci.yml'

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: serverless
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: serverless/go.mod
          # Off rather than saved from every branch: caches are saved on main only (#308), and
          # this module's dependencies download in seconds.
          cache: false

      - name: Generated code is current
        run: |
          go generate ./...
          git diff --exit-code -- . || {
            echo "::error::generated code is stale (api.gen.go, zones.gen.go): run go generate ./... in serverless/"
            exit 1
          }

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build for Lambda
        run: ./build.sh

      - name: Check the scripts
        run: shellcheck build.sh

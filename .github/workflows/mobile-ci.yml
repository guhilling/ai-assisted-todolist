name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      # The app imports the website's generated types, validators, texts and date rules (#267).
      - 'frontend/src/**'
      - 'frontend/scripts/check-no-prerelease-deps.mjs'
      - 'keycloak/**'
      - 'e2e/backend-e2e.properties'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'frontend/src/**'
      - 'frontend/scripts/check-no-prerelease-deps.mjs'
      - 'keycloak/**'
      - 'e2e/backend-e2e.properties'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

# The app is built here, never by EAS (doc/decisions/mobile-app.md): the checks, an Android build on
# Linux, an iOS simulator build on macOS, and a Maestro run of the Android build against the
# end-to-end stack. GitHub's hosted runners are free for a public repository, macOS included.
jobs:
  checks:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: No pre-release dependencies
        run: npm run check:deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  android:
    runs-on: ubuntu-26.04
    env:
      APP_VARIANT: dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Generate the Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build the release APK
        # Signed with the debug key, as the generated project does for a release build; a store
        # build is signed for real by the distribution story (#276).
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: taskfest-dev-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  ios:
    runs-on: macos-26
    env:
      APP_VARIANT: dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Generate the iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios
      - name: Build for the simulator
        working-directory: mobile/ios
        run: |
          workspace=$(ls -d *.xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 50

  maestro:
    needs: android
    runs-on: ubuntu-26.04
    env:
      MAESTRO_VERSION: 2.11.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the backend image
        working-directory: backend
        run: ./mvnw -B package -DskipTests -Dquarkus.container-image.build=true

      - name: Build the frontend image
        working-directory: frontend
        run: docker build -f docker/Dockerfile -t taskfest-frontend:e2e .

      - name: Start the stack
        run: docker compose -f deployment/docker/docker-compose.e2e.yml up -d --wait

      - name: Put a task on gunnar's board
        # With a bearer token, as the app sends one (#266): Keycloak's password grant stands in for
        # the browser sign-in the Maestro flow then does for real.
        run: |
          token=$(curl -sS --fail http://localhost:8082/realms/taskfest/protocol/openid-connect/token \
            -d grant_type=password -d scope=openid -d client_id=taskfest-backend -d client_secret=taskfest-secret \
            -d username=gunnar -d password=gunnar | jq -r .id_token)
          curl -sS --fail http://localhost:3000/api/tasks -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "{\"description\":\"Seeded by CI for the app\",\"dueDate\":\"$(date -u +%F)\",\"importance\":\"HIGH\",\"state\":\"TODO\"}"

      - uses: actions/download-artifact@v8
        with:
          name: taskfest-dev-apk
          path: apk

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb reverse tcp:3000 tcp:3000
            adb reverse tcp:8082 tcp:8082
            adb install apk/app-release.apk
            maestro test mobile/maestro --format junit --output maestro-report.xml --test-output-dir maestro-output

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-output
          path: |
            maestro-output
            maestro-report.xml
          retention-days: 14

      - name: Collect the stack logs
        if: failure()
        run: docker compose -f deployment/docker/docker-compose.e2e.yml logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose -f deployment/docker/docker-compose.e2e.yml down -v

name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      # The Maestro flow runs the backend and the end-to-end stack built from this commit.
      - 'backend/**'
      - 'frontend/docker/**'
      - 'deployment/docker/docker-compose.e2e.yml'
      # The app imports the website's generated types, validators, texts and date rules (#267).
      - 'frontend/src/**'
      - 'frontend/scripts/check-no-prerelease-deps.mjs'
      - 'keycloak/**'
      - 'e2e/backend-e2e.properties'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      # The Maestro flow runs the backend and the end-to-end stack built from this commit.
      - 'backend/**'
      - 'frontend/docker/**'
      - 'deployment/docker/docker-compose.e2e.yml'
      - 'frontend/src/**'
      - 'frontend/scripts/check-no-prerelease-deps.mjs'
      - 'keycloak/**'
      - 'e2e/backend-e2e.properties'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

# The emulator, in one place for the job that caches its setup and the jobs that run on it: a change
# here is a new cache tag (mobile/maestro/emulator-cache.sh).
env:
  BUILDCACHE: ghcr.io/guhilling/taskfest-buildcache
  EMULATOR_API_LEVEL: '34'
  EMULATOR_TARGET: google_apis
  EMULATOR_ARCH: x86_64
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none

# The app is built here, never by EAS (doc/decisions/mobile-app.md): the checks, an Android build on
# Linux, an iOS simulator build on macOS, and a Maestro run of the Android build against the
# end-to-end stack. GitHub's hosted runners are free for a public repository, macOS included.
jobs:
  checks:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: No pre-release dependencies
        run: npm run check:deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  android:
    runs-on: ubuntu-26.04
    # It takes 7 to 9 minutes; one run hung for 28 before it was cancelled, and GitHub's own
    # limit is six hours.
    timeout-minutes: 30
    env:
      APP_VARIANT: dev
    steps:
      - uses: actions/checkout@v7
      # The APK of an earlier run, when nothing it is built from has changed since: the app, the
      # website's sources it bundles, and this workflow; not the flows or the tests, which are not
      # in it. A pull request touching only the backend runs the flows without building the app
      # again. Looked up before anything is installed, so the key covers the checkout alone.
      - name: Reuse the APK if the app is unchanged
        id: apk
        uses: actions/cache@v6
        with:
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          key: >-
            taskfest-dev-apk-${{ hashFiles('mobile/**', 'frontend/src/**', '.github/workflows/mobile-ci.yml',
            '!mobile/maestro/**', '!**/*.test.ts', '!**/*.test.tsx') }}
      - uses: actions/setup-node@v7
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '17'
      # Gradle's own cache: the dependencies and the wrapper, kept between runs. Written from main
      # only, read everywhere, so a pull request starts from main's.
      - uses: gradle/actions/setup-gradle@v6
        if: steps.apk.outputs.cache-hit != 'true'
      - name: Install dependencies
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: mobile
        run: npm ci
      - name: Generate the Android project
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build the release APK
        if: steps.apk.outputs.cache-hit != 'true'
        # Signed with the debug key, as the generated project does for a release build; a store
        # build is signed for real by the distribution story (#276). For the emulator's x86_64 only:
        # this APK exists for the Maestro flows, and the native code for the other three
        # architectures was most of the build's time.
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: taskfest-dev-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  ios:
    runs-on: macos-26
    env:
      APP_VARIANT: dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Generate the iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios
      - name: Build for the simulator
        working-directory: mobile/ios
        # pipefail, or the step's status would be tail's and a failed build would pass.
        run: |
          set -o pipefail
          workspace=$(ls -d *.xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 50

  # The emulator's setup -- system image, AVD and a booted snapshot -- in a private image on GitHub's
  # Container Registry, for the emulator jobs to start from (#302). Written from main only, as the
  # Gradle cache is: every pull request reads it, so none may write it. A run whose setup is cached
  # already only checks the package is still private.
  emulator-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: oras-project/setup-oras@v2

      - name: Log in to GitHub's Container Registry
        run: echo "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Find out whether this setup is cached
        id: cache
        run: |
          tag=$(bash mobile/maestro/emulator-cache.sh tag)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if bash mobile/maestro/emulator-cache.sh exists "$tag"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Cached already: $tag"
          fi

      - name: Check the cache is private
        if: steps.cache.outputs.hit == 'true'
        run: bash mobile/maestro/emulator-cache.sh private

      - name: Let the emulator use KVM
        if: steps.cache.outputs.hit != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot the emulator once, for its snapshot
        # Without -no-snapshot, the emulator saves its booted state when the action stops it. The
        # animations are turned off by each run instead, as the action's own guide does it.
        if: steps.cache.outputs.hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Booted; the emulator saves the snapshot as it stops."

      - name: Cache the setup
        if: steps.cache.outputs.hit != 'true'
        run: bash mobile/maestro/emulator-cache.sh save "${{ steps.cache.outputs.tag }}"

  maestro:
    needs: android
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # To read the emulator's cached setup.
      packages: read
    # The flows in two shares at once, each on an emulator and a stack of its own: together they
    # took nearly five minutes, the longest share takes a little over two. run-on-emulator.sh says
    # which flow is in which.
    strategy:
      fail-fast: false
      matrix:
        share: [board, others]
    env:
      MAESTRO_VERSION: 2.11.0
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack's other services
        # Postgres, Keycloak and LocalStack need nothing built here, so they are pulled and started
        # first, while the rest of the job runs; Keycloak's start is the slowest part of the stack.
        run: |
          nohup docker compose -f deployment/docker/docker-compose.e2e.yml up -d postgres keycloak localstack \
            > services-start.log 2>&1 &
          echo $! > services-start.pid

      - uses: oras-project/setup-oras@v2

      - name: Restore the emulator's setup
        env:
          GH_TOKEN: ${{ github.token }}
        # From the cache main keeps (#302); without it, the emulator is set up and booted from
        # scratch, as before.
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          bash mobile/maestro/emulator-cache.sh restore "$(bash mobile/maestro/emulator-cache.sh tag)"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the backend image
        working-directory: backend
        run: ./mvnw -B package -DskipTests -Dquarkus.container-image.build=true

      - name: Build the frontend image
        working-directory: frontend
        run: docker build -f docker/Dockerfile -t taskfest-frontend:e2e .

      - name: Start the stack
        # In the background, while the emulator is installed and boots: `up -d` itself waits for the
        # services the backend depends on to be healthy, which is most of its minute. seed-stack.sh
        # waits for this to finish, then for the whole stack, before the flows run. The other
        # services' start comes first, so two `compose up` never race.
        run: |
          while kill -0 "$(cat services-start.pid)" 2>/dev/null; do sleep 1; done
          cat services-start.log
          nohup docker compose -f deployment/docker/docker-compose.e2e.yml up -d > stack-start.log 2>&1 &
          echo $! > stack-start.pid

      - uses: actions/download-artifact@v8
        with:
          name: taskfest-dev-apk
          path: apk

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          # The restored AVD and its snapshot, when there are; a new AVD, booted cold, when not.
          # Nothing is saved back: every run starts from main's snapshot.
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: bash mobile/maestro/seed-stack.sh && bash mobile/maestro/run-on-emulator.sh apk/app-release.apk ${{ matrix.share }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-output-${{ matrix.share }}
          path: |
            maestro-output
            maestro-report.xml
            maestro-offline-*.xml
            maestro-reminders.xml
          retention-days: 14

      - name: Collect the stack logs
        if: failure()
        run: docker compose -f deployment/docker/docker-compose.e2e.yml logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose -f deployment/docker/docker-compose.e2e.yml down -v

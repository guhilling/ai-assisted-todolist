name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      # The Maestro flow runs the backend and the end-to-end stack built from this commit.
      - 'backend/**'
      - 'frontend/docker/**'
      - 'deployment/docker/docker-compose.e2e.yml'
      # The app imports the website's generated types, validators, texts and date rules (#267).
      - 'frontend/src/**'
      - 'frontend/scripts/check-no-prerelease-deps.mjs'
      - 'keycloak/**'
      - 'e2e/backend-e2e.properties'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      # The Maestro flow runs the backend and the end-to-end stack built from this commit.
      - 'backend/**'
      - 'frontend/docker/**'
      - 'deployment/docker/docker-compose.e2e.yml'
      - 'frontend/src/**'
      - 'frontend/scripts/check-no-prerelease-deps.mjs'
      - 'keycloak/**'
      - 'e2e/backend-e2e.properties'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore npm's cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-mobile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('npm-mobile-{0}-{1}-', runner.os, runner.arch) || '' }}
      - run: npm ci
      - name: No pre-release dependencies
        run: npm run check:deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Save npm's cache
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

  android:
    runs-on: ubuntu-26.04
    # It takes 7 to 9 minutes; one run hung for 28 before it was cancelled, and GitHub's own
    # limit is six hours.
    timeout-minutes: 30
    env:
      APP_VARIANT: dev
    steps:
      - uses: actions/checkout@v7
      # The APK of an earlier run, when nothing it is built from has changed since: the app, the
      # website's sources it bundles, and this workflow; not the flows or the tests, which are not
      # in it. A pull request touching only the backend runs the flows without building the app
      # again. Looked up before anything is installed, so the key covers the checkout alone -- and
      # worked out once, in a step of its own: the cache's post step would hash mobile/** again after
      # the build, node_modules and Gradle's output included, which outran the two minutes GitHub
      # gives hashFiles in the ios job (#405).
      - name: Key the APK by what it is made of
        id: apk-key
        run: >-
          echo "key=taskfest-dev-apk-${{ hashFiles('mobile/**', 'frontend/src/**', '.github/workflows/mobile-ci.yml',
          '!mobile/maestro/**', '!**/*.test.ts', '!**/*.test.tsx') }}" >> "$GITHUB_OUTPUT"
      - name: Reuse the APK if the app is unchanged
        id: apk
        uses: actions/cache@v6
        with:
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.apk-key.outputs.key }}
      - uses: actions/setup-node@v7
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          node-version: '24'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore npm's cache
        id: npm-cache
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-mobile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('npm-mobile-{0}-{1}-', runner.os, runner.arch) || '' }}
      - uses: actions/setup-java@v6
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '17'
      # Gradle's own cache: the dependencies and the wrapper, kept between runs. Written from main
      # only, read everywhere, so a pull request starts from main's.
      - uses: gradle/actions/setup-gradle@v6
        if: steps.apk.outputs.cache-hit != 'true'
      - name: Install dependencies
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: mobile
        run: npm ci
      - name: Generate the Android project
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build the release APK
        if: steps.apk.outputs.cache-hit != 'true'
        # Signed with the debug key, as the generated project does for a release build; a store
        # build is signed for real by mobile-release.yml (#276). For the emulator's x86_64 only:
        # this APK exists for the Maestro flows, and the native code for the other three
        # architectures was most of the build's time.
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: taskfest-dev-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  ios:
    runs-on: macos-26
    # The build takes about ten minutes, the simulator's shares a few more.
    timeout-minutes: 45
    env:
      APP_VARIANT: dev
    steps:
      - uses: actions/checkout@v7
      # The app built and signed, kept by what it is made of, as the android job keeps its APK: a
      # pull request touching only the backend or the flows shares into it without building it
      # again, which is two thirds of this job. Saved only once the checks below passed on it.
      # The key is worked out once, from the checkout alone: the cache's post step would hash
      # mobile/** again after the build, Pods and node_modules included, which outran the two
      # minutes GitHub gives hashFiles.
      - name: Key the app by what it is made of
        id: app-key
        run: >-
          echo "key=taskfest-dev-ios-app-${{ hashFiles('mobile/**', 'frontend/src/**', '.github/workflows/mobile-ci.yml',
          '.github/scripts/check-share-extension.py', '.github/scripts/check-share-activation.swift',
          '.github/scripts/sign-with-app-group.sh', '!mobile/maestro/**', '!**/*.test.ts', '!**/*.test.tsx') }}" >> "$GITHUB_OUTPUT"
      # Restored and saved apart, not by actions/cache, which saves only when the whole job passes:
      # a failed share would cost the next run the build.
      - name: Reuse the app if it is unchanged
        id: app
        uses: actions/cache/restore@v6
        with:
          path: mobile/build-ios/TaskFestDev.app
          key: ${{ steps.app-key.outputs.key }}
      - uses: actions/setup-node@v7
        if: steps.app.outputs.cache-hit != 'true'
        with:
          node-version: '24'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore npm's cache
        id: npm-cache
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-mobile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('npm-mobile-{0}-{1}-', runner.os, runner.arch) || '' }}
      - name: Install dependencies
        if: steps.app.outputs.cache-hit != 'true'
        working-directory: mobile
        run: npm ci
      - name: Generate the iOS project
        if: steps.app.outputs.cache-hit != 'true'
        working-directory: mobile
        run: npx expo prebuild --platform ios
      - name: Build for the simulator
        if: steps.app.outputs.cache-hit != 'true'
        working-directory: mobile/ios
        # pipefail, or the step's status would be tail's and a failed build would pass.
        run: |
          set -o pipefail
          workspace=$(ls -d *.xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 50
      - name: The share extension is built, and signs, as it should be
        if: steps.app.outputs.cache-hit != 'true'
        # Sharing into the app (#356): the extension expo-sharing's plugin generates -- its name in
        # the share sheet, its App Group, and the shares its type rule lets through.
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -path '*Release-iphonesimulator/*.app' -maxdepth 6 -type d | head -1)
          python3 .github/scripts/check-share-extension.py built "$app" "Create Task (Dev)"
          swift .github/scripts/check-share-activation.swift "$app/PlugIns/expo-sharing-extension.appex/Info.plist"
          # The release's ad hoc signing, tried here on every change: signed with the App Group, the
          # app and the extension both carry it.
          bash .github/scripts/sign-with-app-group.sh "$app" \
            "$(ls mobile/ios/*/*.entitlements | grep -v /expo-sharing-extension/)" \
            mobile/ios/expo-sharing-extension/expo-sharing-extension.entitlements
          python3 .github/scripts/check-share-extension.py signed "$app"
          # Where the cache above keeps it, under the name it has.
          mkdir -p mobile/build-ios
          ditto "$app" mobile/build-ios/TaskFestDev.app
      - name: Where the app is, reused or built
        run: echo "APP=$PWD/mobile/build-ios/TaskFestDev.app" >> "$GITHUB_ENV"
      # Before the simulator, so that a failed share costs neither cache.
      - name: Keep the app for the next run
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: mobile/build-ios/TaskFestDev.app
          key: ${{ steps.app-key.outputs.key }}
      - name: Save npm's cache
        if: github.ref == 'refs/heads/main' && steps.app.outputs.cache-hit != 'true' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: Install Maestro
        run: |
          set -a && source mobile/maestro/maestro.env && set +a
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # Sharing through the real share sheet (#380): a photo from Photos, on an iPhone simulator,
      # into the build signed just above. No stack runs here, so each share ends at the
      # app, opened signed out with the share kept; the Android flows take one on to the board.
      # It fails the job (#401); doc/mobile/sharing.md says how it is kept reliable.
      - name: Share into the app on a simulator
        id: share
        env:
          # Maestro's driver on a freshly booted simulator took longer than its default to start, and once
          # longer than 180 s (#401).
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        run: bash mobile/maestro/ios/run-on-simulator.sh "$APP"
      - name: Say where to look when the share failed
        if: failure() && steps.share.outcome == 'failure'
        run: echo "::error title=iOS share check failed::The artifact maestro-output-ios has the screenshots, Maestro's debug and console output, and the simulator's log."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-output-ios
          path: |
            maestro-output-ios
            maestro-ios-*.xml
          retention-days: 14

  maestro:
    needs: android
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # To read the emulator's cached setup.
      packages: read
    # The flows in two shares at once, each on an emulator and a stack of its own: together they
    # took nearly five minutes, the longest share takes a little over two. run-on-emulator.sh says
    # which flow is in which.
    strategy:
      fail-fast: false
      matrix:
        share: [board, others]
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack's other services
        # Postgres, Keycloak and LocalStack need nothing built here, so they are pulled and started
        # first, while the rest of the job runs; Keycloak's start is the slowest part of the stack.
        run: |
          nohup docker compose -f deployment/docker/docker-compose.e2e.yml up -d postgres keycloak localstack \
            > services-start.log 2>&1 &
          echo $! > services-start.pid

      - uses: oras-project/setup-oras@v2

      - name: Restore the emulator's setup
        env:
          GH_TOKEN: ${{ github.token }}
        # From the cache emulator-cache.yml keeps (#302). Without it -- not built yet, or the
        # registry out of reach -- the emulator is set up and booted from scratch, as before: the
        # script never fails this step. The settings go to the environment for the action below.
        run: |
          (set -a && source mobile/maestro/emulator.env && env | grep '^EMULATOR_') >> "$GITHUB_ENV"
          bash mobile/maestro/emulator-cache.sh restore

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore Maven's cache
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('maven-{0}-{1}-', runner.os, runner.arch) || '' }}

      - name: Build the backend image
        working-directory: backend
        # Jib cannot retry a base image download that breaks off; the script can, and only that.
        run: $GITHUB_WORKSPACE/.github/scripts/retry-on-broken-download.sh ./mvnw -B package -DskipTests -Dquarkus.container-image.build=true

      - name: Build the frontend image
        working-directory: frontend
        run: docker build -f docker/Dockerfile -t taskfest-frontend:e2e .

      - name: Start the stack
        # In the background, while the emulator is installed and boots: `up -d` itself waits for the
        # services the backend depends on to be healthy, which is most of its minute. seed-stack.sh
        # waits for this to finish, then for the whole stack, before the flows run. The other
        # services' start comes first, so two `compose up` never race.
        run: |
          while kill -0 "$(cat services-start.pid)" 2>/dev/null; do sleep 1; done
          cat services-start.log
          nohup docker compose -f deployment/docker/docker-compose.e2e.yml up -d > stack-start.log 2>&1 &
          echo $! > stack-start.pid

      - uses: actions/download-artifact@v8
        with:
          name: taskfest-dev-apk
          path: apk

      - name: Install Maestro
        run: |
          set -a && source mobile/maestro/maestro.env && set +a
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          ram-size: ${{ env.EMULATOR_RAM_SIZE }}
          # The restored AVD and its snapshot, when there are; a new AVD, booted cold, when not.
          # Nothing is saved back: every run starts from main's snapshot.
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: bash mobile/maestro/seed-stack.sh && bash mobile/maestro/run-on-emulator.sh apk/app-release.apk ${{ matrix.share }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-output-${{ matrix.share }}
          path: |
            maestro-output
            maestro-report.xml
            maestro-offline-*.xml
            maestro-reminders.xml
            maestro-attach.xml
            maestro-keyboard.xml
            maestro-share-*.xml
          retention-days: 14

      - name: Collect the stack logs
        if: failure()
        run: docker compose -f deployment/docker/docker-compose.e2e.yml logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose -f deployment/docker/docker-compose.e2e.yml down -v

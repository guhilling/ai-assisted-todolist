name: Consistency

# Checks that nothing here contradicts anything else here. Most jobs guard the same class of
# problem: a fact stated in more than one place, where the copies drift silently and the first
# evidence is something unrelated going wrong much later. One tests the scripts under
# .github/scripts that make decisions rather than comparisons.
#
# None needs more than Python's standard library.
#
# No path filter, unlike the other workflows: a reference to doc/ can sit in any file -- a Javadoc,
# a TypeScript comment, OpenTofu -- so any change can break one, and every job here takes seconds.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  images:
    name: Generated artwork is current
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the committed artwork is current
        # The artwork is committed, so it goes stale the moment someone edits the generator
        # without running it -- or hand-edits an SVG, which looks like it worked right up until
        # the next regeneration silently reverts it.
        run: |
          python3 doc/images/generate.py
          # --intent-to-add first, or a brand new diagram would be untracked and so invisible
          # to git diff -- the one case this gate most needs to catch.
          # The mark's copies outside doc/images are generated too: the website's favicon and
          # sign-in icon, and the sources of the app's icons.
          generated="doc/images frontend/public/favicon.svg frontend/src/assets/taskfest-mark.svg mobile/assets/icons"
          git add --all --intent-to-add $generated
          git diff --exit-code $generated || {
            echo "::error::The generated artwork is out of date. Run: python3 doc/images/generate.py"
            exit 1
          }

  postgres-version:
    name: One PostgreSQL version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check every PostgreSQL pin agrees
        # Dev Services for %dev and %test, both Compose stacks, and the local-development doc
        # each name a version. They drifted to 17 and 18 once already, which matters because the
        # enum-type tests run against whatever Dev Services starts.
        run: python3 .github/scripts/check-postgres-version.py

  cors-rule:
    name: One attachment CORS rule
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the CORS rule is the same in AWS and the end-to-end stack
        # attachments.tf and the LocalStack init script each carry the bucket's rule (#204); the
        # end-to-end run is only evidence about AWS while the two agree.
        run: python3 .github/scripts/check-cors-rule.py

  script-tests:
    name: Script tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # build-site.py, whose videos page has tests (#278), renders Markdown with this.
      - name: Install the site generator's dependencies
        run: pip install -r .github/scripts/requirements.txt
      - name: Test the scripts that have tests
        # sonar-gate-issue.py decides between opening, commenting on and closing an issue; a
        # wrong decision is silence or duplicates, and nothing else would notice either.
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  doc-references:
    name: Documentation references
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Every doc/ path named anywhere exists
        # The site build catches a dead link between pages; this catches the rest -- a code
        # comment or a CLAUDE.md naming a page that moved. Splitting the long documents into
        # chapters moved 47 such references at once. Shared with hilling-it-website (#455);
        # doc/api/ holds generated files, not documentation.
        uses: guhilling/dev-conventions/check-doc-references@8b07d0e22028147900706eb4d1f293ce59a90a32 # v1.0.0
        with:
          exclude: |
            doc/api/
      - name: Every decision says when it was taken, and the index lists them all
        # The status line under each decision (#409), and an index that had drifted to thirteen
        # decisions missing and one long renamed.
        run: python3 .github/scripts/check-decisions.py
      - name: No local issue forms, so the account defaults apply
        # Any valid file in .github/ISSUE_TEMPLATE, config.yml included, turns off every form
        # from guhilling/.github (guhilling/ai-assisted-todolist#457).
        run: |
          if [ -e .github/ISSUE_TEMPLATE ]; then
            echo "::error::.github/ISSUE_TEMPLATE turns off the shared issue forms; change them in guhilling/.github instead."
            exit 1
          fi

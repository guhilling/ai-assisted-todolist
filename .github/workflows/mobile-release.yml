name: Mobile release

# The app's qa and prod builds, signed and uploaded to the testers (#276): TestFlight's internal
# testers on iOS, Google Play's internal testing on Android. doc/mobile/distribution.md has the
# accounts, keys and settings behind it, and what a person does by hand.
#
# Called by release.yml for every final release, on the release tag, once the GitHub Release
# exists. Started by hand from the Actions tab, it builds the tag chosen under "Use workflow from"
# again -- for a failed upload, or for Android's first bundle, which Play's API cannot upload and
# a person does once -- and only a tag that is released: release.yml checked that it is on main.
#
# The store credentials live in the app-stores environment, which admits release tags only: the
# App Store Connect key is an Admin key (Apple's cloud signing needs one), so no branch or pull
# request gets near it. A platform whose repository variable is not set yet is skipped, so
# releases go on before the accounts are set up.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build again
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

jobs:
  numbers:
    name: Release numbers
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.numbers.outputs.version }}
      build: ${{ steps.numbers.outputs.build }}
    steps:
      - name: Version from the tag, build number from the clock
        id: numbers
        env:
          GH_TOKEN: ${{ github.token }}
        # A store version is three numbers; a pre-release is not built (release.yml skips them),
        # so this is stricter than release.yml's own check on purpose. Only a released tag is
        # built: its release went through release.yml's gate, which refused a tag off main.
        # The build number is the minutes since 2026-01-01 UTC: it rises with every run, whichever
        # workflow starts it, which a run number would not -- release.yml and this workflow count
        # separately. Both platforms of a run share it; they are separate apps in each store.
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The apps are built for a release tag vX.Y.Z, not for $GITHUB_REF_NAME."
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null; then
            echo "::error::$GITHUB_REF_NAME has no GitHub Release; the apps are built for released tags only."
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build=$(( ($(date -u +%s) - 1767225600) / 60 ))" >> "$GITHUB_OUTPUT"

  android:
    name: Android ${{ matrix.variant }}
    needs: numbers
    if: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT != '' && inputs.platform != 'ios' }}
    runs-on: ubuntu-26.04
    environment: app-stores
    timeout-minutes: 60
    permissions:
      contents: read
      # Google's Workload Identity Federation takes the job's OIDC token in place of a key.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: qa
            package: de.hilling.taskfest.qa
          - variant: prod
            package: de.hilling.taskfest
    env:
      APP_VARIANT: ${{ matrix.variant }}
      TASKFEST_VERSION: ${{ needs.numbers.outputs.version }}
      TASKFEST_BUILD_NUMBER: ${{ needs.numbers.outputs.build }}
      TASKFEST_QA_COGNITO_ISSUER: ${{ vars.TASKFEST_QA_COGNITO_ISSUER }}
      TASKFEST_QA_APP_CLIENT_ID: ${{ vars.TASKFEST_QA_APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Everything the build needs is set
        # Seconds here rather than a failure after twenty minutes of building. The qa app also
        # needs its test accounts: without them it would install and offer no way to sign in.
        env:
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
        run: bash .github/scripts/check-mobile-release-settings.sh android ${{ matrix.variant }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore npm's cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-mobile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('npm-mobile-{0}-{1}-', runner.os, runner.arch) || '' }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Generate the Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build the signed bundle
        working-directory: mobile/android
        env:
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        # Signed with the upload key; Play re-signs with the app signing key it keeps (Play App
        # Signing). The generated project signs a release with the debug key, so the key is handed
        # to Gradle as the injected signing configuration, the one Android Studio's "Generate
        # Signed Bundle" uses, rather than by editing build.gradle through a config plugin.
        run: |
          echo "$UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$UPLOAD_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$UPLOAD_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$UPLOAD_KEY_PASSWORD"
          rm "$RUNNER_TEMP/upload.jks"
      - name: Keep the bundle
        # For the app's first upload, which a person makes in Play Console.
        uses: actions/upload-artifact@v7
        with:
          name: taskfest-${{ matrix.variant }}-${{ needs.numbers.outputs.version }}-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Sign in to Google Cloud
        id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Upload to Play internal testing
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: >
          python3 .github/scripts/play-upload.py
          --package ${{ matrix.package }}
          --bundle mobile/android/app/build/outputs/bundle/release/app-release.aab
          --release-name ${{ needs.numbers.outputs.version }}

  ios:
    name: iOS ${{ matrix.variant }}
    needs: numbers
    if: ${{ vars.APPLE_TEAM_ID != '' && inputs.platform != 'android' }}
    runs-on: macos-26
    environment: app-stores
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [qa, prod]
    env:
      APP_VARIANT: ${{ matrix.variant }}
      TASKFEST_VERSION: ${{ needs.numbers.outputs.version }}
      TASKFEST_BUILD_NUMBER: ${{ needs.numbers.outputs.build }}
      TASKFEST_QA_COGNITO_ISSUER: ${{ vars.TASKFEST_QA_COGNITO_ISSUER }}
      TASKFEST_QA_APP_CLIENT_ID: ${{ vars.TASKFEST_QA_APP_CLIENT_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Everything the build needs is set
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash .github/scripts/check-mobile-release-settings.sh ios ${{ matrix.variant }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore npm's cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-mobile-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('npm-mobile-{0}-{1}-', runner.os, runner.arch) || '' }}
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Generate the iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios
      - name: Archive, unsigned
        working-directory: mobile/ios
        # Unsigned on purpose: signing here would make this runner a development certificate it
        # forgets afterwards, a new one on every release. The export below signs instead, with the
        # distribution certificate Apple keeps (cloud signing). pipefail, or the step's status
        # would be tail's.
        run: |
          set -o pipefail
          workspace=$(ls -d *.xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TaskFest.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive | tail -n 50
      - name: Sign and upload to TestFlight
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        # destination "upload" sends the signed build straight to App Store Connect; with automatic
        # signing and -allowProvisioningUpdates, Xcode fetches or makes the App Store profile and
        # signs with the cloud-managed certificate. The build reaches the internal testers once
        # Apple has processed it.
        run: |
          set -o pipefail
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TaskFest.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" | tail -n 50
          rm "$RUNNER_TEMP/AuthKey.p8"

name: End-to-end tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'keycloak/**'
      - 'docker/docker-compose.e2e.yml'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'keycloak/**'
      - 'docker/docker-compose.e2e.yml'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the backend image
        working-directory: backend
        run: ./mvnw -B package -DskipTests -Dquarkus.container-image.build=true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build the frontend image
        working-directory: frontend
        run: docker build -f docker/Dockerfile -t todo-frontend:e2e .

      - name: Start the stack
        run: docker compose -f docker/docker-compose.e2e.yml up -d --wait

      - name: Wait for the frontend
        run: curl -sS --retry 60 --retry-delay 2 --retry-all-errors --fail http://localhost:3000/api/auth/providers

      - name: Install the end-to-end dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        working-directory: e2e
        run: npx playwright test

      - name: Collect the stack logs
        if: failure()
        run: docker compose -f docker/docker-compose.e2e.yml logs --no-color

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose -f docker/docker-compose.e2e.yml down -v

name: End-to-end tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'keycloak/**'
      - 'deployment/docker/docker-compose.e2e.yml'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'keycloak/**'
      - 'deployment/docker/docker-compose.e2e.yml'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

# The whole suite on both architectures (#249): on arm64 the images are built natively for arm64 --
# Jib by the backend's arm64-image profile, the frontend by Docker -- and the stack runs on them,
# which is the proof they work there and what a Mac without Rosetta runs. GitHub's arm64 runners
# are free for public repositories.
#
# Two jobs sharing their steps through a YAML anchor, rather than a matrix: Renovate reads runner
# labels only from a literal `runs-on:`, and the pinned runners are meant to move by its pull
# requests (doc/decisions/build-and-dependencies.md).
jobs:
  e2e-amd64:
    name: e2e (amd64)
    runs-on: ubuntu-26.04
    env:
      ARCH: amd64
    steps: &e2e-steps
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the backend image
        working-directory: backend
        run: ./mvnw -B package -DskipTests -Dquarkus.container-image.build=true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build the frontend image
        working-directory: frontend
        run: docker build -f docker/Dockerfile -t taskfest-frontend:e2e .

      # Built for this runner's architecture, or the stack would run under emulation at best.
      - name: Check the images are built for this machine
        run: |
          for image in quay.io/ghilling/taskfest-backend:latest taskfest-frontend:e2e; do
            built=$(docker image inspect "$image" --format '{{.Architecture}}')
            echo "$image: $built"
            [ "$built" = "$ARCH" ] || { echo "::error::$image is $built, not $ARCH"; exit 1; }
          done

      - name: Start the stack
        run: docker compose -f deployment/docker/docker-compose.e2e.yml up -d --wait

      - name: Wait for the frontend
        run: curl -sS --retry 60 --retry-delay 2 --retry-all-errors --fail http://localhost:3000/api/auth/providers

      - name: Install the end-to-end dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Collect the live checks
        # They run against a deployed environment, after a deploy (live-tests.yml), not here; but
        # a syntax or import error in them should fail this pull request, not the next release.
        working-directory: e2e
        run: |
          npx playwright test -c playwright.live.config.ts --list
          npx playwright test -c playwright.live-signed-in.config.ts --list

      - name: Run the end-to-end tests
        working-directory: e2e
        run: npx playwright test

      - name: Collect the stack logs
        if: failure()
        run: docker compose -f deployment/docker/docker-compose.e2e.yml logs --no-color

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ env.ARCH }}
          path: e2e/playwright-report
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose -f deployment/docker/docker-compose.e2e.yml down -v

  e2e-arm64:
    name: e2e (arm64)
    runs-on: ubuntu-24.04-arm
    env:
      ARCH: arm64
    steps: *e2e-steps

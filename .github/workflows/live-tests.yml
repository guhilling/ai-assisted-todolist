name: Live tests

# Checks a deployed environment from the outside, through CloudFront, as a visitor would (#141).
#
# Runs after every deploy to qa -- called by deploy-frontend.yml, which is the last step of a
# release, and by deploy-backend.yml when that was started by hand -- and by hand from the
# Actions tab. While the environment is down the API checks skip with the reason and the
# frontend checks still run; e2e/live/backend-state.ts decides, and the run summary says which.
#
# Three jobs. The smoke checks sign nobody in and need no AWS role and no secret. The signed-in
# scenarios (#144) run after them as the environment's test accounts: their job assumes the
# environment's live-test role, which may do one thing -- set the accounts' passwords -- and sets a
# fresh random one per account for this run, kept in that step's environment and nowhere else.
# The app's flows (#278) run after them, on an Android emulator, as the same test accounts: the
# released qa app, signed in through Cognito, adding, changing and attaching -- each flow recorded,
# as the website's scenarios are. mobile/maestro/live/run-on-qa.sh says how.
# A failure fails the run that deployed, visibly; it rolls nothing back -- that stays a person's
# decision.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to check
        type: choice
        # prod has no live tests yet (#141, out of scope).
        options: [qa]
        default: qa
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke-test ${{ inputs.environment }}
    runs-on: ubuntu-26.04
    outputs:
      backend: ${{ steps.smoke.outputs.backend }}
    env:
      # qa is the only environment with live tests; prod's name has no suffix, and gets its
      # mapping when it gets live tests.
      LIVE_BASE_URL: https://taskfest-${{ inputs.environment }}.cloud.hilling.de
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore npm's cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('npm-e2e-{0}-{1}-', runner.os, runner.arch) || '' }}

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the live checks
        id: smoke
        working-directory: e2e
        run: npm run test:live

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live
          path: e2e/playwright-report-live
          retention-days: 7

  signed-in:
    name: Signed-in scenarios on ${{ inputs.environment }}
    needs: smoke
    # Nothing to sign in to while the environment is down; the smoke job found out already.
    if: needs.smoke.outputs.backend != 'down'
    runs-on: ubuntu-26.04
    # Its own GitHub environment, which only the live-test role trusts: this job runs npm and a
    # browser, and in the deploy role's environment its token would have been good for that role too.
    environment: ${{ inputs.environment }}-live-test
    # Two runs at once would reset each other's passwords and clear each other's tasks.
    concurrency:
      group: live-tests-signed-in-${{ inputs.environment }}
      cancel-in-progress: false
      # Every waiting run waits its turn: by default a newer one would replace an older one still
      # waiting, and that deploy's scenarios would never run.
      queue: max
    permissions:
      contents: read
      id-token: write
    env:
      LIVE_BASE_URL: https://taskfest-${{ inputs.environment }}.cloud.hilling.de
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore npm's cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('npm-e2e-{0}-{1}-', runner.os, runner.arch) || '' }}

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::808706946095:role/taskfest-${{ inputs.environment }}-live-test
          aws-region: eu-central-1

      - name: Set this run's passwords and run the scenarios
        working-directory: e2e
        # One step, so the passwords live in its environment only: never written to a file, never
        # logged (masked), gone when it ends. The next run sets new ones.
        run: |
          source live/set-test-passwords.sh
          E2E_IDENTITY=cognito npm run test:live-signed-in

      # Every scenario's video, named by its title, for the site to publish the newest run's
      # (pages.yml, under videos/). Failed runs too: a video of what went wrong is the most useful one.
      - name: Collect the videos
        if: ${{ !cancelled() }}
        working-directory: e2e
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # ffmpeg for each video's poster frame; without it the videos are published without one.
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null || echo "::warning::no ffmpeg, so no posters"
          # jq -e, so that a backend that cannot be reached leaves "unknown", not an empty version:
          # jq on empty input prints nothing and exits 0, so curl's failure alone never fell back.
          version=$(curl -fsS "$LIVE_BASE_URL/api/version" | jq -er .version || echo unknown)
          python3 ../.github/scripts/collect-live-videos.py live-videos/report.json live-videos/out \
            --environment "$ENVIRONMENT" --version "$version" --run-url "$RUN_URL" \
            --recorded-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload the videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-videos-${{ inputs.environment }}
          path: e2e/live-videos/out
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live-signed-in
          path: e2e/playwright-report-live-signed-in
          retention-days: 7


  # The released app the app's flows run (#278): the bundle mobile-release.yml uploaded to Play,
  # kept as an artifact of the release's run, not one built here. A job of its own, outside the
  # concurrency group below: in a release, that build runs beside the deploy and may not be done
  # yet, and waiting for it must not hold up the next run's scenarios. Otherwise the bundle is
  # there or it is not -- a version never released, or whose bundle has expired (30 days), has no
  # app to test, and the app's flows are skipped with a warning.
  app-bundle:
    name: The released app for ${{ inputs.environment }}
    needs: smoke
    if: needs.smoke.outputs.backend != 'down'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      actions: read
    outputs:
      artifact: ${{ steps.bundle.outputs.artifact }}
      version: ${{ steps.bundle.outputs.version }}
    env:
      LIVE_BASE_URL: https://taskfest-${{ inputs.environment }}.cloud.hilling.de
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Find the released app
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          IN_RELEASE: ${{ github.workflow == 'Release' }}
        run: |
          set -euo pipefail
          version=$(curl -fsS "$LIVE_BASE_URL/api/version" | jq -er .version)
          name="taskfest-${ENVIRONMENT}-${version}-aab"
          attempts=1
          if [ "$IN_RELEASE" = true ]; then attempts=40; fi
          id=""
          for attempt in $(seq "$attempts"); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=1" \
              --jq '[.artifacts[] | select(.expired | not)][0].id // empty')
            if [ -n "$id" ]; then break; fi
            if [ "$attempt" -lt "$attempts" ]; then sleep 30; fi
          done
          if [ -z "$id" ]; then
            echo "::warning::No app of ${version} is kept ($name): the app's live run is skipped."
            exit 0
          fi
          echo "artifact=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  app:
    name: The app on ${{ inputs.environment }}
    # After the website's scenarios: both sign in as the same test accounts, and each clears them.
    # Run when those failed too -- the app's flows say something of their own -- but not while the
    # environment is down, nor without a released app.
    needs: [smoke, signed-in, app-bundle]
    if: ${{ !cancelled() && needs.app-bundle.result == 'success' && needs.app-bundle.outputs.artifact != '' }}
    runs-on: ubuntu-26.04
    # Booting the emulator and the two flows take about ten minutes; a hung boot or adb must not
    # hold the concurrency group below for GitHub's six hours.
    timeout-minutes: 30
    # The live-test role's environment, as for the website's scenarios, and their concurrency group:
    # a run of either resets the passwords and clears the tasks the other is using.
    environment: ${{ inputs.environment }}-live-test
    concurrency:
      group: live-tests-signed-in-${{ inputs.environment }}
      cancel-in-progress: false
      # Every waiting run waits its turn: by default a newer one would replace an older one still
      # waiting, and that deploy's scenarios would never run.
      queue: max
    permissions:
      contents: read
      id-token: write
      # To download the released app, an artifact of the release's run.
      actions: read
      # To read the emulator's cached setup.
      packages: read
    env:
      LIVE_BASE_URL: https://taskfest-${{ inputs.environment }}.cloud.hilling.de
      ENVIRONMENT: ${{ inputs.environment }}
      BUNDLETOOL_VERSION: 1.18.3
    steps:
      - uses: actions/checkout@v7

      - name: Download the released app
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.app-bundle.outputs.artifact }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > bundle.zip
          unzip -q bundle.zip -d bundle

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # A bundle is what Play takes; an emulator takes an APK. bundletool makes one APK of it for any
      # device, signed with a key made here for the purpose: the emulator only needs some signature.
      - name: Turn the bundle into an APK
        run: |
          curl -fsSL -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          keytool -genkeypair -keystore live.keystore -storepass android -keypass android -alias live \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=TaskFest live run" -noprompt
          java -jar bundletool.jar build-apks --bundle bundle/app-release.aab --output app.apks --mode universal \
            --ks live.keystore --ks-pass pass:android --ks-key-alias live --key-pass pass:android
          unzip -q app.apks universal.apk

      - uses: oras-project/setup-oras@v2

      - name: Restore the emulator's setup
        env:
          GH_TOKEN: ${{ github.token }}
        # The setup Mobile CI's flows run on (emulator-cache.yml, #302); booted from scratch without it.
        run: |
          (set -a && source mobile/maestro/emulator.env && env | grep '^EMULATOR_') >> "$GITHUB_ENV"
          bash mobile/maestro/emulator-cache.sh restore

      # Playwright, for clearing the test accounts before and after the flows (run-on-qa.sh).
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore npm's cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('npm-e2e-{0}-{1}-', runner.os, runner.arch) || '' }}

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Maestro
        run: |
          set -a && source mobile/maestro/maestro.env && set +a
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::808706946095:role/taskfest-${{ inputs.environment }}-live-test
          aws-region: eu-central-1

      # One step, as for the website's scenarios: run-on-qa.sh sets this run's passwords and keeps
      # them in its own environment.
      - name: Run the app's flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          ram-size: ${{ env.EMULATOR_RAM_SIZE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: bash mobile/maestro/live/run-on-qa.sh universal.apk

      # Each flow's recording, for the site to publish beside the website's (pages.yml, under videos/).
      # Failed runs too, as for the website.
      - name: Collect the videos
        if: ${{ !cancelled() }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.app-bundle.outputs.version }}
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null || echo "::warning::no ffmpeg, so no posters"
          python3 .github/scripts/collect-live-videos.py --app live-app-videos/flows.json live-app-videos/out \
            --environment "$ENVIRONMENT" --version "$VERSION" --run-url "$RUN_URL" \
            --recorded-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload the videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-videos-${{ inputs.environment }}-app
          path: live-app-videos/out
          retention-days: 30
          if-no-files-found: ignore

      # Maestro's screenshots only: its other output records each command as run, the typed password
      # among them.
      - name: Upload the screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-live-screenshots
          path: maestro-live-output/**/*.png
          retention-days: 7
          if-no-files-found: ignore

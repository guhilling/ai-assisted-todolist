name: CodeQL

# Deliberately not path-filtered, unlike serverless-ci and frontend-ci. The README carries a
# CodeQL badge, and a path-filtered workflow makes that badge report the last run that
# happened to touch the matching directory, which can be many commits old.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Queries are updated on GitHub's side, so a weekly run finds things that were not
    # findable when the code landed.
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@v7

      # The runner's Go is older than the one serverless/go.mod asks for.
      - uses: actions/setup-go@v6
        if: matrix.language == 'go'
        with:
          go-version-file: serverless/go.mod
          cache: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

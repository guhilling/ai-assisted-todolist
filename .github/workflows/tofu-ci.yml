name: OpenTofu CI

# Everything here runs without AWS credentials: formatting, the environment-sameness rule, and
# `validate`, which resolves the module and checks every resource against the provider's own
# schema. There is deliberately no `plan` -- that needs credentials and a state lock, and a plan
# on a pull request would describe changes to a live environment rather than check the code.

on:
  pull_request:
    paths:
      - 'deployment/aws-tofu/**'
      - '.github/workflows/tofu-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'deployment/aws-tofu/**'
      - '.github/workflows/tofu-ci.yml'

permissions:
  contents: read

jobs:
  tofu:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: deployment/aws-tofu
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v1
        with:
          # Pinned, and matching what is installed locally, so a formatting or validation
          # difference is never just a version difference -- `fmt` output has changed between
          # minor releases before now.
          tofu_version: '1.12.6'
          # The wrapper replaces the CLI with a script that also sets step outputs, which
          # swallows exit codes inside the `for` loop below.
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -recursive -check -diff

      - name: Check the environments still differ only in their values
        # The point of the module-plus-thin-root layout is that prod is a parameter change. This
        # is what stops it quietly becoming a second codebase.
        run: python3 check-environments-match.py

      - name: Check every billable resource is behind the teardown switch
        # Tearing an environment down is a parameter change, which only works if the resources
        # that bill are actually guarded. An unguarded one fails silently -- the teardown
        # succeeds, the resource keeps running, and the bill is the first evidence.
        run: python3 check-billable-guard.py

      - name: Scan for misconfigurations
        # Trivy reads the .tf files and fails on any finding, at every severity: a finding is
        # either fixed or suppressed inline with `#trivy:ignore:<ID>` and a comment saying why, so
        # every exception is written next to the thing it excuses.
        #
        # Run from the official image rather than through an action, so the step is one pinned
        # binary and no install script. --skip-check-update uses the checks embedded in that
        # binary instead of downloading the latest bundle: a new check then arrives with a
        # Renovate pull request, rather than failing an unrelated change on the day it ships.
        # It runs before `init`, so it scans this repository's code and not downloaded modules.
        #
        # trivy.tfvars sets running = true. Without it every billable resource evaluates to
        # zero instances and is never checked at all -- the database once passed this scan by
        # not existing.
        uses: docker://aquasec/trivy:0.74.0
        with:
          args: config --skip-check-update --exit-code 1 --tf-vars deployment/aws-tofu/trivy.tfvars deployment/aws-tofu

      - name: Test the SPA routing function
        # The CloudFront Function decides which paths are the app and which are files; getting it
        # wrong either breaks deep links or serves the app with a 200 for a missing asset. Node's
        # built-in runner, so there is nothing to install.
        run: node --test modules/environment/spa-routing.test.mjs

      - name: Lint the shell script
        # shellcheck ships on the GitHub-hosted Ubuntu images. env.sh is the one place here where
        # a quoting mistake would be discovered by destroying the wrong thing.
        run: shellcheck env.sh

      - name: Validate every root
        # Every directory that is applied on its own: the two environments, and `account/` for
        # the things there is one of per AWS account.
        #
        # -backend=false skips the S3 backend, which would need credentials. It still downloads
        # the provider, which is what makes the validation meaningful: the resource schemas come
        # from the provider, not from OpenTofu.
        run: |
          for root in environments/*/ account/; do
            echo "::group::${root}"
            tofu -chdir="${root}" init -backend=false -input=false
            tofu -chdir="${root}" validate
            echo "::endgroup::"
          done

name: Publish container images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One push at a time, in order: two pushes to main close together would race for `latest`, and the
# older build can finish last. A newer push waits; GitHub keeps one waiting run per group.
concurrency:
  group: publish-images
  cancel-in-progress: false

env:
  # Every platform the images are published for (#249), in one place for both images and the check.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            image: quay.io/ghilling/taskfest-backend
            # Jib cannot retry a base image download that breaks off; the script can, and only that.
            build-command: $GITHUB_WORKSPACE/.github/scripts/retry-on-broken-download.sh ./mvnw -B package -DskipTests -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true -Dquarkus.jib.platforms="$PLATFORMS"
          - name: frontend
            context: frontend
            image: quay.io/ghilling/taskfest-frontend
            build-command: docker buildx build --push --platform "$PLATFORMS" --tag quay.io/ghilling/taskfest-frontend:latest -f docker/Dockerfile .
    defaults:
      run:
        working-directory: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USER || secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD || secrets.QUAY_ROBOT_TOKEN || secrets.QUAY_PASSWORD }}
      - uses: actions/setup-java@v6
        if: matrix.name == 'backend'
        with:
          distribution: temurin
          java-version: '25'
      # Read on every branch, saved from main only, with no fallback there so that a new entry starts
      # clean: see doc/testing/continuous-integration.md.
      - name: Restore Maven's cache
        id: maven-cache
        if: matrix.name == 'backend'
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('maven-{0}-{1}-', runner.os, runner.arch) || '' }}
      - name: Publish image
        env:
          IMAGE_TAG: latest
        run: ${{ matrix.build-command }}

      # The tag must be one image index with every platform built (#249), or a machine of the
      # missing one pulls nothing it can run.
      - name: Check the image is published for every platform
        working-directory: .
        run: python3 .github/scripts/check-image-platforms.py "${{ matrix.image }}:latest" "$PLATFORMS"

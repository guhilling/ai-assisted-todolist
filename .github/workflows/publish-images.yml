name: Publish container images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            image: quay.io/ghilling/todo-backend
            build-command: ./mvnw -B package -DskipTests -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true
          - name: frontend
            context: frontend
            image: quay.io/ghilling/todo-frontend
            build-command: docker buildx build --push --tag quay.io/ghilling/todo-frontend:latest -f docker/Dockerfile .
    defaults:
      run:
        working-directory: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USER || secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD || secrets.QUAY_ROBOT_TOKEN || secrets.QUAY_PASSWORD }}
      - uses: actions/setup-java@v5
        if: matrix.name == 'backend'
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        if: matrix.name == 'frontend'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: matrix.name == 'frontend'
        run: npm ci
      - name: Publish image
        env:
          IMAGE_TAG: latest
        run: ${{ matrix.build-command }}

name: Publish container images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            image: quay.io/ghilling/taskfest-backend
            build-command: ./mvnw -B package -DskipTests -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true -Dquarkus.jib.platforms=linux/amd64,linux/arm64
          - name: frontend
            context: frontend
            image: quay.io/ghilling/taskfest-frontend
            build-command: docker buildx build --push --platform linux/amd64,linux/arm64 --tag quay.io/ghilling/taskfest-frontend:latest -f docker/Dockerfile .
    defaults:
      run:
        working-directory: ${{ matrix.context }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USER || secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD || secrets.QUAY_ROBOT_TOKEN || secrets.QUAY_PASSWORD }}
      - uses: actions/setup-java@v6
        if: matrix.name == 'backend'
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        if: matrix.name == 'frontend'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: matrix.name == 'frontend'
        run: npm ci
      - name: Publish image
        env:
          IMAGE_TAG: latest
        run: ${{ matrix.build-command }}

      # The tag must be one image index with both architectures (#249), or a machine of the
      # missing one pulls nothing it can run.
      - name: Check the image is published for amd64 and arm64
        working-directory: .
        env:
          IMAGE: ${{ matrix.image }}:latest
        run: |
          platforms=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[]?.platform | select(.os == "linux") | .architecture] | sort | unique | join(",")')
          echo "$IMAGE: $platforms"
          if [ "$platforms" != "amd64,arm64" ]; then
            echo "::error::$IMAGE is not published for amd64 and arm64"
            exit 1
          fi

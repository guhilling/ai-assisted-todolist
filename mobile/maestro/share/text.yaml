# Text with a link, shared into the app while it runs (#355): "Add a task" opens with it as the
# description, and the task is added with a due date chosen. run-on-emulator.sh shares the text.
appId: de.hilling.taskfest.dev
name: Share text into the app
---
- extendedWaitUntil:
    visible: "Read the article https://example.com/a"
    timeout: 20000
- assertVisible: "Add a task"
- tapOn: "In 1 week"
- hideKeyboard
- takeScreenshot: 30-shared-text
- tapOn: "Add"
- extendedWaitUntil:
    visible: 'Edit "Read the article https://example.com/a"'
    timeout: 15000
- takeScreenshot: 31-shared-text-added

# An image shared the way a person does it (#355): the Files app's Share, Android's share sheet,
# Create Task (Dev). "Add a task" opens with the image waiting, and it is attached once the task is added.
# The app names it as the link the Files app shares says -- or by its type, when the link ends in a
# document's number -- so either name will do here.
appId: com.google.android.documentsui
name: Share an image through the share sheet
---
- launchApp:
    appId: com.google.android.documentsui
- runFlow:
    when:
      notVisible: "attach-me.png"
    commands:
      - tapOn: "Show roots"
      - tapOn: "Downloads"
- longPressOn: "attach-me.png"
- tapOn: "Share"
# The sheet opens half-way, its first row of apps only, and whether Create Task (Dev) is among them is
# Android's choice. Pulled up from inside, the sheet opens all the way; a scroll would start above
# it, where a touch closes it.
- runFlow:
    when:
      notVisible: "Create Task \\(Dev\\)"
    commands:
      - swipe:
          start: 50%, 75%
          end: 50%, 15%
      - waitForAnimationToEnd
      - takeScreenshot: 32-share-sheet-pulled-up
- takeScreenshot: 32-share-sheet
- tapOn: "Create Task \\(Dev\\)"
- extendedWaitUntil:
    visible: "Remove (attach-me|shared)\\.png"
    timeout: 30000
- tapOn:
    id: "task-description"
- inputText: "Shared image"
- tapOn: "In 1 week"
- hideKeyboard
- takeScreenshot: 33-shared-image
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Open (attach-me|shared)\\.png"
    timeout: 30000
- takeScreenshot: 34-shared-image-added

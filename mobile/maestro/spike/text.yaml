# SPIKE #279: a text with a link, shared while the app is open, opens "Add a task" with it.
appId: de.hilling.taskfest.dev
name: Spike - share text
---
- extendedWaitUntil:
    visible: "Read the article https://example.com/a"
    timeout: 20000
- takeScreenshot: spike-01-text-form
- hideKeyboard
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Read the article https://example.com/a"
    timeout: 15000
- takeScreenshot: spike-02-text-added

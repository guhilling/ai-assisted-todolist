# A link shared from Safari (#380): Share sits behind the ⋯ menu on iOS 26, and TaskFest Dev in the
# share sheet's row of apps. As with the photo, the app opens signed out and keeps the share.
appId: com.apple.mobilesafari
name: Share a link into the app through iOS's share sheet
---
- launchApp
- openLink:
    link: https://example.com
    browser: true
# Until the page is there, Safari shows its start page, whose card would take the taps below.
- extendedWaitUntil:
    visible: "Example Domain"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 8000
# A fresh simulator's Safari shows a tip over its toolbar the first time; it has no label to tap
# by, and goes with a tap beside it.
- runFlow:
    when:
      notVisible: "More"
    commands:
      - tapOn:
          point: 90%, 71%
      - waitForAnimationToEnd
- tapOn: "More"
- waitForAnimationToEnd
- tapOn: "Share"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-share-link-1-sheet
- tapOn: "TaskFest Dev"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Sign in with Keycloak"
    timeout: 60000
- takeScreenshot: ios-share-link-2-app

# A page shared from Safari the way a person does it on an iPhone (#380): ⋯, Share, iOS's share
# sheet, TaskFest Dev in the row of apps. The extension takes the link and opens the app. As in
# share-photo.yaml, no stack runs on the macOS runner, so the flow ends at the app's sign-in.
appId: com.apple.mobilesafari
name: Share a link from Safari into the app through iOS's share sheet
---
- launchApp
# A photo share that came through late, after share-photo.yaml had given up on it, leaves iOS's
# question standing over everything; it is not this share's, so it is turned down. That run has
# failed already, but the Safari share is still tried, and says whether it works.
- runFlow:
    when:
      visible: 'Open in .TaskFest Dev.\?'
    commands:
      - tapOn: "Cancel"
      - waitForAnimationToEnd
- runFlow: tap-share-link.yaml
- extendedWaitUntil:
    visible: '(Open in .TaskFest Dev.\?|Sign in with Keycloak)'
    timeout: 90000
    optional: true
# Now and then TaskFest's extension stays at its compose view (Cancel / Post), or never starts,
# and hands nothing over in time (#473). Safari, and the extension in it, are started afresh and
# the page shared again, once. Unlike share-photo.yaml, a question that comes late is turned down,
# not answered: it reads the same for a photo's late share as for this one, and only one this
# share brings may pass the flow. One that reached the app's sign-in without a question, though,
# can only be Safari's, and the page is not shared again.
- runFlow:
    when:
      notVisible: '(Open in .TaskFest Dev.\?|Sign in with Keycloak)'
    commands:
      - takeScreenshot: ios-share-link-1b-stuck
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: '(Open in .TaskFest Dev.\?|Sign in with Keycloak)'
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible: 'Open in .TaskFest Dev.\?'
          commands:
            - tapOn: "Cancel"
            - waitForAnimationToEnd
      - runFlow:
          when:
            notVisible: "Sign in with Keycloak"
          commands:
            - runFlow: tap-share-link.yaml
      - extendedWaitUntil:
          visible: '(Open in .TaskFest Dev.\?|Sign in with Keycloak)'
          timeout: 90000
- takeScreenshot: ios-share-link-2-handed-over
# The simulator's iOS may ask first, as for the photo; a tap while the question is still coming in
# can be lost (#401). The question is SpringBoard's, not part of Safari's sheet, so Open is found
# by name. As for the photo, the question may be gone by the time Open is looked for (#473).
- waitForAnimationToEnd
- repeat:
    while:
      visible: 'Open in .TaskFest Dev.\?'
    times: 3
    commands:
      - tapOn:
          text: "Open"
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sign in with Keycloak"
    timeout: 60000
- takeScreenshot: ios-share-link-3-app

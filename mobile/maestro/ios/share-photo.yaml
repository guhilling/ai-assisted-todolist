# A photo shared the way a person does it on an iPhone (#380): Photos' Share, iOS's share sheet,
# TaskFest Dev in the row of apps -- iOS 26 names a share extension by its app there, not by its
# own name (doc/mobile/sharing.md). The extension copies the photo and opens the app, which, signed
# out, keeps the share for after the sign-in. No stack runs on the macOS runner, so the flow ends
# there: offered, and handed to the app.
appId: com.apple.mobileslideshow
name: Share a photo into the app through iOS's share sheet
---
- launchApp
- waitForAnimationToEnd:
    timeout: 8000
# A fresh simulator's Photos greets its first user, once or twice; none of this is TaskFest's.
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
            - waitForAnimationToEnd
- tapOn:
    text: "Photo, .*"
    index: 0
- waitForAnimationToEnd
- tapOn: "Share"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-share-photo-1-sheet
- tapOn: "TaskFest Dev"
# Photos prepares the photo for the extension first, which a fresh simulator takes its time over.
- extendedWaitUntil:
    notVisible: "Preparing.*"
    timeout: 120000
- takeScreenshot: ios-share-photo-2-prepared
# The extension opens the app by its URL scheme; should iOS ask first, it is let.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Sign in with Keycloak"
    timeout: 60000
- takeScreenshot: ios-share-photo-3-app

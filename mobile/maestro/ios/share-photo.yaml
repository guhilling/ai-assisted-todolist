# A photo shared the way a person does it on an iPhone (#380): Photos' Share, iOS's share sheet,
# TaskFest Dev in the row of apps -- iOS 26 names a share extension by its app there, not by its
# own name (doc/mobile/sharing.md). The extension takes the photo and opens the app. No stack runs on
# the macOS runner, so the flow ends at the app's sign-in: offered, taken, and the app opened. Which
# photo does not matter; the first of those every simulator comes with is shared.
appId: com.apple.mobileslideshow
name: Share a photo into the app through iOS's share sheet
---
- launchApp
- runFlow: tap-share-photo.yaml
# Photos prepares the photo for the extension first -- "Preparing…", which may show only after a
# moment -- and the extension then opens the app by its URL scheme. The simulator's iOS asks first,
# which another release may not. A passing share gets there in 14 to 70 s.
- extendedWaitUntil:
    visible: '(Open in .TaskFest Dev.\?|Sign in with Keycloak)'
    timeout: 90000
    optional: true
# Now and then the simulator's Photos never finishes preparing the photo, and iOS never starts the
# extension (#401). Photos is started afresh and the photo shared again, once.
- runFlow:
    when:
      notVisible: '(Open in .TaskFest Dev.\?|Sign in with Keycloak)'
    commands:
      - takeScreenshot: ios-share-photo-1b-stuck
      - launchApp:
          stopApp: true
      # The first share may come through after all, late: its question then stands over the
      # restarted Photos, and a second share cannot get past it (#473). It is answered below, like
      # one on time -- the extension has taken the photo and is opening the app, which is what
      # this flow is for -- and the photo is not shared again.
      - extendedWaitUntil:
          visible: 'Open in .TaskFest Dev.\?'
          timeout: 10000
          optional: true
      - runFlow:
          when:
            notVisible: 'Open in .TaskFest Dev.\?'
          commands:
            - runFlow: tap-share-photo.yaml
      - extendedWaitUntil:
          visible: '(Open in .TaskFest Dev.\?|Sign in with Keycloak)'
          timeout: 90000
- takeScreenshot: ios-share-photo-2-handed-over
# A tap on Open while the question is still coming in was lost once (#401): it waits for the
# question to settle, and taps again while it is still there. The question may be gone by the
# time Open is looked for, the app already opening (#473), so the tap may find nothing; that the
# app opened is checked next.
- waitForAnimationToEnd
- repeat:
    while:
      visible: 'Open in .TaskFest Dev.\?'
    times: 3
    commands:
      - tapOn:
          text: "Open"
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sign in with Keycloak"
    timeout: 60000
- takeScreenshot: ios-share-photo-3-app

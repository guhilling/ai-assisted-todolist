# A photo shared the way a person does it on an iPhone (#380): Photos' Share, iOS's share sheet,
# TaskFest Dev in the row of apps -- iOS 26 names a share extension by its app there, not by its
# own name (doc/mobile/sharing.md). The extension takes the photo and opens the app. No stack runs on
# the macOS runner, so the flow ends at the app's sign-in: offered, taken, and the app opened. Which
# photo does not matter; the first of those every simulator comes with is shared.
appId: com.apple.mobileslideshow
name: Share a photo into the app through iOS's share sheet
---
- launchApp
- waitForAnimationToEnd:
    timeout: 8000
# A fresh simulator's Photos greets its first user, once or twice; none of this is TaskFest's.
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
            - waitForAnimationToEnd
- tapOn:
    text: "Photo, .*"
    index: 0
- waitForAnimationToEnd
# A tap while the library is still settling may open nothing (#401): tapped again until the photo
# is open, which is when Share is there.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            notVisible: "Share"
          commands:
            - tapOn:
                text: "Photo, .*"
                index: 0
            - waitForAnimationToEnd
- tapOn: "Share"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-share-photo-1-sheet
# A newly installed app may sit beyond the row's visible end; More lists them all.
- runFlow:
    when:
      notVisible: "TaskFest Dev"
    commands:
      - tapOn: "More"
      - waitForAnimationToEnd
- tapOn: "TaskFest Dev"
# Photos prepares the photo for the extension first -- "Preparing…", which may show only after a
# moment and then take a minute or two on a fresh simulator -- and the extension then opens the app
# by its URL scheme. The simulator's iOS asks first, which another release may not.
- extendedWaitUntil:
    visible: '(Open in .TaskFest Dev.\?|Sign in with Keycloak)'
    timeout: 180000
- takeScreenshot: ios-share-photo-2-handed-over
- runFlow:
    when:
      visible: 'Open in .TaskFest Dev.\?'
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Sign in with Keycloak"
    timeout: 60000
- takeScreenshot: ios-share-photo-3-app

# Part of share-photo.yaml, which runs it twice when Photos hangs (#401): in Photos, open the first
# photo, Share, and TaskFest Dev in the share sheet. Not a flow of its own; run-on-simulator.sh runs
# share-photo.yaml and share-link.yaml, never this file directly.
appId: com.apple.mobileslideshow
---
- waitForAnimationToEnd:
    timeout: 8000
# A tap while the library is still settling may open nothing (#401): tapped again until the photo
# is open, which is when Share is there. Only from the grid: when run-on-simulator.sh runs the flow
# once more, iOS may reopen Photos on the photo the first run had opened (#500). iOS 27's Photos may
# greet only once it has started, over the grid, so each round answers it first, and a round that
# finds neither the greeting nor the grid yet goes on to the next (#658).
- repeat:
    times: 4
    commands:
      - runFlow: answer-photos-greeting.yaml
      - runFlow:
          when:
            notVisible: "Share"
          commands:
            - tapOn:
                text: "Photo, .*"
                index: 0
                optional: true
            - waitForAnimationToEnd
# The greeting may come even after the loop, over the photo just opened (#658).
- runFlow: answer-photos-greeting.yaml
# Without Share no photo was opened: Photos never showed its grid (#500). Said here, rather than as a
# Share the tap below cannot find.
- assertVisible: "Share"
- tapOn: "Share"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ios-share-photo-1-sheet
# A newly installed app may sit beyond the row's visible end; More lists them all.
- runFlow:
    when:
      notVisible: "TaskFest Dev"
    commands:
      - tapOn: "More"
      - waitForAnimationToEnd
- tapOn: "TaskFest Dev"

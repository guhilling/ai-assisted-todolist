# Opens Photos once before the shares and waits for its grid (#500): its first start after boot
# hung twice, black or at "Preparing…", in the measured share. Not a share of its own; whether it
# helps is a guess, and run-on-simulator.sh does not fail when it does not get there.
appId: com.apple.mobileslideshow
name: Warm Photos up
---
- launchApp
- runFlow: answer-photos-greeting.yaml
- extendedWaitUntil:
    visible: "Photo, .*"
    timeout: 180000
- stopApp

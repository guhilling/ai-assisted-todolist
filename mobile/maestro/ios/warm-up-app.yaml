# Starts the app once before the shares and waits for its sign-in (#500): its first start after
# boot once took 82 s, inside the measured share. Not a share of its own; run-on-simulator.sh does
# not fail when it does not get there.
appId: de.hilling.taskfest.dev
name: Warm the app up
---
- launchApp
- extendedWaitUntil:
    visible: "Sign in with Keycloak"
    timeout: 150000
- stopApp

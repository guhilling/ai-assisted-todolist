quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/taskfest}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:taskfest}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:taskfest}
# IAM database authentication, on AWS only. Set TASKFEST_DATASOURCE_CREDENTIALS_PROVIDER to rds-iam
# (RdsIamCredentialsProvider.BEAN_NAME) and every new connection signs a token from the task role
# instead of using the password above, which is then ignored. Unset, as in the Compose stacks, it
# resolves to nothing and the password is used as before.
%prod.quarkus.datasource.credentials-provider=${TASKFEST_DATASOURCE_CREDENTIALS_PROVIDER:}
%prod.quarkus.datasource.credentials-provider-name=${TASKFEST_DATASOURCE_CREDENTIALS_PROVIDER:}
# Dev and test deliberately leave the JDBC URL unset so Dev Services starts PostgreSQL.
%dev.quarkus.datasource.devservices.image-name=postgres:18-alpine
%test.quarkus.datasource.devservices.image-name=postgres:18-alpine
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false
# Only in tests, and only so TaskQueryCountTest can count statements: the rule it enforces is
# that a GET's query count does not grow with the number of rows it returns. Collecting these
# costs something, so production does not.
%test.quarkus.hibernate-orm.statistics=true
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.xml
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
# Written on every build alongside the live /q/openapi endpoint. doc/api/generate.py turns
# it into the committed contract under doc/api, which the frontend generates its response
# validators from and GitHub Pages publishes.
quarkus.smallrye-openapi.store-schema-directory=target/openapi
# The defaults are "backend API" and the two auto-detected localhost servers, which are fine
# for a spec nobody reads and wrong for a published one. A relative server URL is also the
# true one: the API is at /api on whatever origin serves the app.
quarkus.smallrye-openapi.info-title=TaskFest API
quarkus.smallrye-openapi.info-description=The task board's REST surface. Every response \
  schema here is published as JSON Schema and checked at runtime by the frontend.
quarkus.smallrye-openapi.info-license-name=Apache-2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0
quarkus.smallrye-openapi.servers=/
quarkus.oidc.enabled=${QUARKUS_OIDC_ENABLED:true}
quarkus.oidc.application-type=web-app
# Production and QA sign in with Google, and only with Google.
%prod.quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:https://accounts.google.com}
%prod.quarkus.oidc.client-id=${TASKFEST_OIDC_GOOGLE_CLIENT_ID:unconfigured-client}
%prod.quarkus.oidc.credentials.secret=${TASKFEST_OIDC_GOOGLE_CLIENT_SECRET:unconfigured-secret}
%qa.quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:https://accounts.google.com}
%qa.quarkus.oidc.client-id=${TASKFEST_OIDC_GOOGLE_CLIENT_ID:unconfigured-client}
%qa.quarkus.oidc.credentials.secret=${TASKFEST_OIDC_GOOGLE_CLIENT_SECRET:unconfigured-secret}
# Google's access tokens are opaque, not JWTs, and Google has no introspection endpoint -- yet
# nothing here verifies one. In the code flow Quarkus verifies the ID token, and the claims come
# from it (@IdToken, #136). Injecting the plain JsonWebToken asked for the access token instead,
# which is what made Quarkus try to verify Google's opaque token and fail; #133 and #135 worked
# around that with UserInfo verification until #136 found the cause. Keycloak issues JWTs, so dev
# and test cannot show the difference -- only a Google sign-in in qa can.
# Dev and test leave auth-server-url unset so Keycloak Dev Services can supply it.
%dev,test.quarkus.oidc.client-id=taskfest-backend
%dev,test.quarkus.oidc.credentials.secret=taskfest-secret
# profile carries name and picture. Requested everywhere, not just in dev: without it Google
# returns neither, and they are what the signed-in header shows. These are non-sensitive
# scopes, so Google needs no verification review for them.
quarkus.oidc.authentication.scopes=email,profile
%dev,test.quarkus.keycloak.devservices.realm-path=../keycloak/realm-taskfest.json
%dev,test.quarkus.keycloak.devservices.realm-name=taskfest
%dev,test.quarkus.keycloak.devservices.image-name=quay.io/keycloak/keycloak:26.4
# Tests start Keycloak only where sign-in is on. Starting it takes about 25 s, and every test
# profile restarts Quarkus and its Dev Services, so the default profile and the datasource test
# -- neither of which signs anyone in -- were paying for a Keycloak they never used (#134). The
# sign-in tests switch taskfest.auth.enabled on in their profiles, and that brings it back.
%test.quarkus.keycloak.devservices.enabled=${taskfest.auth.enabled}
# Without Keycloak there is no auth-server-url for the default tenant, and an enabled tenant
# refuses to start without one, so the tenant follows the same switch.
%test.quarkus.oidc.tenant-enabled=${taskfest.auth.enabled}
# A fixed port in dev mode keeps the Keycloak console at a stable URL; tests take a free one.
%dev.quarkus.keycloak.devservices.port=8082
quarkus.oidc.authentication.redirect-path=/api/auth/callback
# The main provider's own paths, so the path decides who answers there: a browser that also holds
# another provider's session (#143) would otherwise be resolved to that provider by its cookie.
quarkus.oidc.tenant-paths=/api/auth/login,/api/auth/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.authentication.cookie-force-secure=${TASKFEST_OIDC_COOKIE_SECURE:false}
%prod.quarkus.oidc.authentication.cookie-force-secure=${TASKFEST_OIDC_COOKIE_SECURE:true}
%qa.quarkus.oidc.authentication.cookie-force-secure=true
# keep-all-tokens is the default. The id-refresh-tokens strategy drops the access token,
# and restoring such a session fails inside Quarkus OIDC with a NullPointerException,
# so every request after a successful sign-in came back 401.
quarkus.oidc.token-state-manager.strategy=keep-all-tokens
# How long a session lasts. The ID token -- an hour, at Google -- is renewed silently with the
# refresh token once it has expired, as long as the session cookie still exists; the cookie
# lives for this extension beyond the token's expiry, and every renewal moves it on. So a session
# ends after eight hours without a request, not an hour after signing in. When it does end, the
# frontend shows a notice and the way back in (#150).
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.authentication.session-age-extension=PT8H
# Google issues a refresh token only when asked for offline access; Keycloak issues one anyway.
%prod.quarkus.oidc.authentication.extra-params.access_type=offline
%qa.quarkus.oidc.authentication.extra-params.access_type=offline
quarkus.oidc.authentication.java-script-auto-redirect=false
# Our own jre-runtime: Temurin's full JRE on Red Hat UBI 10 micro, built from
# deployment/jre-runtime/Containerfile (#66). Pinned to a dated build *and* its digest, so an
# image is reproducible and a re-pushed tag cannot change what gets built; Renovate moves both
# (see the custom manager in .github/renovate.json, since no built-in manager reads a Quarkus
# properties file).
#
# The pin is load-bearing: Jib's default base ships JDK 21 while this code is compiled for 25,
# and on the default the container exits immediately and silently on class file version 69.
# When maven.compiler.release moves, the jre-runtime Containerfile and this pin move with it.
quarkus.jib.base-jvm-image=quay.io/ghilling/jre-runtime:25.0.4.1_1-20261006@sha256:5bae9d5dd1d4fb675730f58c61e24cfb1f0e5f46db2ca5a768bb6115b36d50dd
# Liquibase prints its update summary to stdout as plain text as well as logging it; "log" keeps
# only the logged copy, so a migration's output is JSON like everything else (#122). Set in the
# image rather than one task definition, so it holds wherever the image migrates: the ECS
# migrate task and the Compose stacks alike. The summary is an argument of the update *command*,
# so the variable carries the COMMAND_ infix: the shorter LIQUIBASE_SHOW_SUMMARY_OUTPUT, used
# before, is not a Liquibase setting -- it did nothing but make Liquibase warn about it.
quarkus.jib.environment-variables.LIQUIBASE_COMMAND_SHOW_SUMMARY_OUTPUT=log
# The image starts through a script that makes a self-signed keystore and then runs Java exactly
# as Jib's own entry point would (#247): the prod profile serves TLS only, wherever the image runs
# -- behind the load balancer in AWS and behind httpd in the Compose stacks. bash, because Jib
# copies files without their execute bit. backend/CLAUDE.md says what to keep in step.
quarkus.jib.jvm-entrypoint=/bin/bash,/opt/taskfest/start-with-tls.sh
# TLS only in prod (#247): the keystore comes from that script, in QUARKUS_TLS_KEY_STORE_P12_*,
# and no plain-HTTP port is opened. Dev mode and the tests keep plain HTTP on 8080.
%prod.quarkus.http.ssl-port=8443
%prod.quarkus.http.insecure-requests=disabled
quarkus.container-image.registry=quay.io
quarkus.container-image.group=ghilling
quarkus.container-image.name=taskfest-backend
quarkus.container-image.tag=${IMAGE_TAG:latest}

# JSON in AWS and the Compose stacks, plain text locally. `.enabled` is the current key; the bare
# `quarkus.log.console.json` was deprecated and warned at every start-up.
%prod.quarkus.log.console.json.enabled=true
%qa.quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

taskfest.auth.enabled=${TASKFEST_AUTH_ENABLED:false}
%dev.taskfest.auth.enabled=${TASKFEST_AUTH_ENABLED:true}
taskfest.post-login-redirect-uri=${TASKFEST_AUTH_POST_LOGIN_REDIRECT_URI:/}
taskfest.auth.providers.google.label=Google
taskfest.auth.providers.google.client-id=${TASKFEST_OIDC_GOOGLE_CLIENT_ID:}
taskfest.auth.providers.google.client-secret=${TASKFEST_OIDC_GOOGLE_CLIENT_SECRET:}
taskfest.auth.providers.google.issuer=${TASKFEST_OIDC_GOOGLE_ISSUER:https://accounts.google.com}
# Local sign-in provider, backed by the Keycloak container Dev Services starts.
%dev,test.taskfest.auth.providers.keycloak.label=Keycloak
%dev,test.taskfest.auth.providers.keycloak.client-id=taskfest-backend
%dev,test.taskfest.auth.providers.keycloak.client-secret=taskfest-secret
%dev,test.taskfest.auth.providers.keycloak.issuer=${TASKFEST_OIDC_KEYCLOAK_ISSUER:http://localhost:8082/realms/taskfest}
# The test accounts the live tests sign in with: a Cognito pool, in qa only (#190). Declared for
# the prod profile, which is what the deployed image runs in qa and prod alike, and switched off
# unless the task definition turns it on -- it does only where the pool exists
# (deployment/aws-tofu/modules/environment/test-sign-in.tf). Switched off, the provider has no
# credentials and is never offered, and /api/auth/login/cognito is a 404. The block is the one
# doc/authentication.md gives for a further provider; NamedTenantSettingsTest checks it is complete.
%prod.quarkus.oidc.cognito.tenant-enabled=${TASKFEST_OIDC_COGNITO_ENABLED:false}
%prod.quarkus.oidc.cognito.auth-server-url=${TASKFEST_OIDC_COGNITO_ISSUER:https://cognito-idp.eu-central-1.amazonaws.com/unconfigured}
%prod.quarkus.oidc.cognito.client-id=${TASKFEST_OIDC_COGNITO_CLIENT_ID:unconfigured-client}
%prod.quarkus.oidc.cognito.credentials.secret=${TASKFEST_OIDC_COGNITO_CLIENT_SECRET:unconfigured-secret}
%prod.quarkus.oidc.cognito.tenant-paths=/api/auth/login/cognito,/api/auth/callback/cognito
%prod.quarkus.oidc.cognito.authentication.redirect-path=/api/auth/callback/cognito
%prod.quarkus.oidc.cognito.application-type=${quarkus.oidc.application-type}
%prod.quarkus.oidc.cognito.authentication.restore-path-after-redirect=${quarkus.oidc.authentication.restore-path-after-redirect}
%prod.quarkus.oidc.cognito.authentication.scopes=${quarkus.oidc.authentication.scopes}
%prod.quarkus.oidc.cognito.authentication.cookie-same-site=${quarkus.oidc.authentication.cookie-same-site}
%prod.quarkus.oidc.cognito.authentication.cookie-force-secure=${quarkus.oidc.authentication.cookie-force-secure}
%prod.quarkus.oidc.cognito.authentication.java-script-auto-redirect=${quarkus.oidc.authentication.java-script-auto-redirect}
%prod.quarkus.oidc.cognito.authentication.session-age-extension=${quarkus.oidc.authentication.session-age-extension}
%prod.quarkus.oidc.cognito.token-state-manager.strategy=${quarkus.oidc.token-state-manager.strategy}
%prod.quarkus.oidc.cognito.token.refresh-expired=${quarkus.oidc.token.refresh-expired}
%prod.taskfest.auth.providers.cognito.label=TaskFest test account
%prod.taskfest.auth.providers.cognito.client-id=${TASKFEST_OIDC_COGNITO_CLIENT_ID:}
%prod.taskfest.auth.providers.cognito.client-secret=${TASKFEST_OIDC_COGNITO_CLIENT_SECRET:}
%prod.taskfest.auth.providers.cognito.issuer=${TASKFEST_OIDC_COGNITO_ISSUER:}

%test.taskfest.auth.enabled=false

# Coverage. quarkus-jacoco reports on the bytecode Quarkus actually runs, which the stock
# JaCoCo agent cannot see; reuse-data-file stops it wiping what the Maven agent recorded
# for tests that do not boot Quarkus, since both write the same file.
%test.quarkus.jacoco.reuse-data-file=true

# Gravatar is consulted only when the provider supplied no picture of its own.
#
# Off in tests: a @QuarkusTest must not reach out to gravatar.com, and the lookup itself is
# covered by GravatarServiceTest against a local server instead.
%test.taskfest.gravatar.enabled=false

# Attachments (#204): files on a task, their content in S3, moved by the browser through presigned
# links. The limits are Gunnar's (D1): 10 MB a file, 2 a task, 5 a user. The bucket comes from the
# task definition in AWS; locally, Dev Services' LocalStack creates it.
taskfest.attachments.bucket=${TASKFEST_ATTACHMENTS_BUCKET:taskfest-attachments}
taskfest.attachments.max-size-bytes=10485760
taskfest.attachments.max-per-task=2
taskfest.attachments.max-per-user=5
taskfest.attachments.upload-link-lifetime=PT10M
taskfest.attachments.download-link-lifetime=PT1H
taskfest.attachments.max-thumbnail-bytes=65536
# Far beyond the board's eight-second undo, so a slow request or an open tab never costs a file (D3).
taskfest.attachments.undo-window=PT10M
taskfest.attachments.pending-lifetime=PT1H
# The orphan clean-up (#208): objects no attachment refers to, once older than the margin. It runs
# shortly after every start and then hourly; an orphan goes after seven days, and the hourly run
# logs the orphan count for the environment's alarm.
taskfest.attachments.orphan-margin=P7D
taskfest.attachments.orphan-sweep.delay=5m
taskfest.attachments.orphan-sweep.every=${TASKFEST_ATTACHMENTS_ORPHAN_SWEEP_EVERY:1h}
taskfest.attachments.orphan-sweep.alert-above=2
# Account deletion (#213): records kept in the attachment bucket, re-applied during every start and
# daily, pruned once older than the database's oldest snapshot. Off where there is no bucket: the
# plain test profile (the S3 tests' profile switches it on) and the local container stack; the e2e
# stack has LocalStack and keeps them on.
taskfest.account.deletions-enabled=${TASKFEST_ACCOUNT_DELETIONS_ENABLED:true}
%test.taskfest.account.deletions-enabled=false
taskfest.account.db-instance=${TASKFEST_ACCOUNT_DB_INSTANCE:}
taskfest.account.deletion-replay.delay=24h
taskfest.account.deletion-replay.every=24h
# The JDK's HTTP client, the lightest the SDK offers (pom.xml), and the region the task runs in.
quarkus.s3.sync-client.type=url
quarkus.s3.aws.region=${AWS_REGION:eu-central-1}
%dev.quarkus.s3.devservices.buckets=taskfest-attachments
# Tests start LocalStack only where they need it (AttachmentStorageProfile), as they do Keycloak
# (#134): every test profile restarts its containers. Elsewhere the client exists but is never
# called, and the sweep does not run -- its test calls it directly.
%test.quarkus.s3.devservices.enabled=false
%test.quarkus.s3.aws.credentials.type=static
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
%test.quarkus.scheduler.enabled=false

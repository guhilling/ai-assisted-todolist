quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/todolist}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:todolist}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:todolist}
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.oidc.enabled=${QUARKUS_OIDC_ENABLED:false}
quarkus.keycloak.devservices.enabled=false
quarkus.container-image.registry=quay.io
quarkus.container-image.group=ghilling
quarkus.container-image.name=todo-backend
quarkus.container-image.tag=${IMAGE_TAG:latest}

todo.auth.enabled=${TODO_AUTH_ENABLED:false}
todo.auth.providers.google.label=Google
todo.auth.providers.google.client-id=${TODO_OIDC_GOOGLE_CLIENT_ID:}
todo.auth.providers.google.issuer=${TODO_OIDC_GOOGLE_ISSUER:https://accounts.google.com}
todo.auth.providers.google.redirect-uri=${TODO_OIDC_GOOGLE_REDIRECT_URI:http://localhost:3000/auth/callback/google}
todo.auth.providers.apple.label=Apple
todo.auth.providers.apple.client-id=${TODO_OIDC_APPLE_CLIENT_ID:}
todo.auth.providers.apple.issuer=${TODO_OIDC_APPLE_ISSUER:https://appleid.apple.com}
todo.auth.providers.apple.redirect-uri=${TODO_OIDC_APPLE_REDIRECT_URI:http://localhost:3000/auth/callback/apple}
todo.auth.providers.entra.label=Microsoft Entra ID
todo.auth.providers.entra.client-id=${TODO_OIDC_ENTRA_CLIENT_ID:}
todo.auth.providers.entra.issuer=${TODO_OIDC_ENTRA_ISSUER:https://login.microsoftonline.com/common/v2.0}
todo.auth.providers.entra.redirect-uri=${TODO_OIDC_ENTRA_REDIRECT_URI:http://localhost:3000/auth/callback/entra}
todo.auth.providers.facebook.label=Facebook
todo.auth.providers.facebook.client-id=${TODO_OIDC_FACEBOOK_CLIENT_ID:}
todo.auth.providers.facebook.issuer=${TODO_OIDC_FACEBOOK_ISSUER:https://www.facebook.com}
todo.auth.providers.facebook.redirect-uri=${TODO_OIDC_FACEBOOK_REDIRECT_URI:http://localhost:3000/auth/callback/facebook}

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:todolist;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.todo.auth.enabled=false

quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.datasource.db-kind=postgresql
%prod,dev.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/todolist}
%prod,dev.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:todolist}
%prod,dev.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:todolist}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.xml
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.oidc.enabled=${QUARKUS_OIDC_ENABLED:true}
quarkus.oidc.application-type=web-app
quarkus.oidc.auth-server-url=https://accounts.google.com
quarkus.oidc.client-id=${TODO_OIDC_GOOGLE_CLIENT_ID:unconfigured-client}
quarkus.oidc.credentials.secret=${TODO_OIDC_GOOGLE_CLIENT_SECRET:unconfigured-secret}
quarkus.oidc.authentication.redirect-path=/api/auth/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.authentication.cookie-force-secure=${TODO_OIDC_COOKIE_SECURE:false}
%prod.quarkus.oidc.authentication.cookie-force-secure=true
%qa.quarkus.oidc.authentication.cookie-force-secure=true
quarkus.oidc.token-state-manager.strategy=id-refresh-tokens
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.keycloak.devservices.enabled=false
quarkus.container-image.registry=quay.io
quarkus.container-image.group=ghilling
quarkus.container-image.name=todo-backend
quarkus.container-image.tag=${IMAGE_TAG:latest}

%prod.quarkus.log.console.json=true
%qa.quarkus.log.console.json=true
%dev.quarkus.log.console.json=false
%test.quarkus.log.console.json=false

todo.auth.enabled=${TODO_AUTH_ENABLED:false}
todo.post-login-redirect-uri=${TODO_AUTH_POST_LOGIN_REDIRECT_URI:/}
todo.auth.providers.google.label=Google
todo.auth.providers.google.client-id=${TODO_OIDC_GOOGLE_CLIENT_ID:}
todo.auth.providers.google.client-secret=${TODO_OIDC_GOOGLE_CLIENT_SECRET:}
todo.auth.providers.google.issuer=${TODO_OIDC_GOOGLE_ISSUER:https://accounts.google.com}
todo.auth.providers.apple.label=Apple
todo.auth.providers.apple.client-id=${TODO_OIDC_APPLE_CLIENT_ID:}
todo.auth.providers.apple.issuer=${TODO_OIDC_APPLE_ISSUER:https://appleid.apple.com}
todo.auth.providers.entra.label=Microsoft Entra ID
todo.auth.providers.entra.client-id=${TODO_OIDC_ENTRA_CLIENT_ID:}
todo.auth.providers.entra.issuer=${TODO_OIDC_ENTRA_ISSUER:https://login.microsoftonline.com/common/v2.0}
todo.auth.providers.facebook.label=Facebook
todo.auth.providers.facebook.client-id=${TODO_OIDC_FACEBOOK_CLIENT_ID:}
todo.auth.providers.facebook.issuer=${TODO_OIDC_FACEBOOK_ISSUER:https://www.facebook.com}

%test.todo.auth.enabled=false
%test.quarkus.oidc.client-id=test-client
%test.quarkus.oidc.credentials.secret=test-secret

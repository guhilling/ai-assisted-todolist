quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/todolist}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:todolist}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:todolist}
# Dev and test deliberately leave the JDBC URL unset so Dev Services starts PostgreSQL.
%dev.quarkus.datasource.devservices.image-name=postgres:17-alpine
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.xml
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.oidc.enabled=${QUARKUS_OIDC_ENABLED:true}
quarkus.oidc.application-type=web-app
# Production and QA sign in with Google, and only with Google.
%prod.quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:https://accounts.google.com}
%prod.quarkus.oidc.client-id=${TODO_OIDC_GOOGLE_CLIENT_ID:unconfigured-client}
%prod.quarkus.oidc.credentials.secret=${TODO_OIDC_GOOGLE_CLIENT_SECRET:unconfigured-secret}
%qa.quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:https://accounts.google.com}
%qa.quarkus.oidc.client-id=${TODO_OIDC_GOOGLE_CLIENT_ID:unconfigured-client}
%qa.quarkus.oidc.credentials.secret=${TODO_OIDC_GOOGLE_CLIENT_SECRET:unconfigured-secret}
# Dev and test leave auth-server-url unset so Keycloak Dev Services can supply it.
%dev,test.quarkus.oidc.client-id=todolist-backend
%dev,test.quarkus.oidc.credentials.secret=todolist-secret
%dev,test.quarkus.oidc.authentication.scopes=email,profile
%dev,test.quarkus.keycloak.devservices.realm-path=../keycloak/realm-todolist.json
%dev,test.quarkus.keycloak.devservices.realm-name=todolist
%dev,test.quarkus.keycloak.devservices.image-name=quay.io/keycloak/keycloak:26.4
# A fixed port in dev mode keeps the Keycloak console at a stable URL; tests take a free one.
%dev.quarkus.keycloak.devservices.port=8082
quarkus.oidc.authentication.redirect-path=/api/auth/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.authentication.cookie-force-secure=${TODO_OIDC_COOKIE_SECURE:false}
%prod.quarkus.oidc.authentication.cookie-force-secure=${TODO_OIDC_COOKIE_SECURE:true}
%qa.quarkus.oidc.authentication.cookie-force-secure=true
# keep-all-tokens is the default. The id-refresh-tokens strategy drops the access token,
# and restoring such a session fails inside Quarkus OIDC with a NullPointerException,
# so every request after a successful sign-in came back 401.
quarkus.oidc.token-state-manager.strategy=keep-all-tokens
quarkus.oidc.authentication.java-script-auto-redirect=false
# Jib's default base image ships JDK 21, while this code targets 25, so the published image
# could not start at all. Temurin 25 is the JDK the project builds and tests with.
quarkus.jib.base-jvm-image=eclipse-temurin:25-jre
quarkus.container-image.registry=quay.io
quarkus.container-image.group=ghilling
quarkus.container-image.name=todo-backend
quarkus.container-image.tag=${IMAGE_TAG:latest}

%prod.quarkus.log.console.json=true
%qa.quarkus.log.console.json=true
%dev.quarkus.log.console.json=false
%test.quarkus.log.console.json=false

todo.auth.enabled=${TODO_AUTH_ENABLED:false}
%dev.todo.auth.enabled=${TODO_AUTH_ENABLED:true}
todo.post-login-redirect-uri=${TODO_AUTH_POST_LOGIN_REDIRECT_URI:/}
todo.auth.providers.google.label=Google
todo.auth.providers.google.client-id=${TODO_OIDC_GOOGLE_CLIENT_ID:}
todo.auth.providers.google.client-secret=${TODO_OIDC_GOOGLE_CLIENT_SECRET:}
todo.auth.providers.google.issuer=${TODO_OIDC_GOOGLE_ISSUER:https://accounts.google.com}
# Local sign-in provider, backed by the Keycloak container Dev Services starts.
%dev,test.todo.auth.providers.keycloak.label=Keycloak
%dev,test.todo.auth.providers.keycloak.client-id=todolist-backend
%dev,test.todo.auth.providers.keycloak.client-secret=todolist-secret
%dev,test.todo.auth.providers.keycloak.issuer=${TODO_OIDC_KEYCLOAK_ISSUER:http://localhost:8082/realms/todolist}

%test.todo.auth.enabled=false

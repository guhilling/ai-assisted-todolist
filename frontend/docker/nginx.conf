server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # $http_host keeps the port, which the backend needs to build the OIDC redirect_uri.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The OIDC session cookie holds the encrypted tokens and easily exceeds nginx's
        # default 4k header buffer, which would turn every sign-in into a 502.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    location / {
        try_files $uri /index.html;
    }
}

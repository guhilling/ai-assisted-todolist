# Serves the built single-page app and proxies the API to the backend.
#
# Dropped into the image's conf.d, which the stock httpd.conf includes. Everything the
# nginx configuration this replaced was doing has an equivalent here, and the two
# non-obvious ones are commented: both exist because of failures that already happened.

DocumentRoot "/var/www/html"

<Directory "/var/www/html">
    Require all granted

    # The app owns its routing, so a path that is not a real file is not a 404: it is a
    # route the browser should resolve. This is Apache's `try_files $uri /index.html`.
    FallbackResource /index.html
</Directory>

# Headroom, not a fix for anything currently broken -- measured rather than assumed. The OIDC
# session cookie is split across q_session_chunk_1, _2 and so on, and the browser returns all
# of them, plus Keycloak's own, in a single Cookie header: about 5.2 KB against Apache's
# 8190-byte default for one field. That fits today. It is raised because the size depends on
# how many claims the provider puts in the token, a third chunk would not fit, and the failure
# would be a 400 on every request after sign-in rather than anything that points at a cause.
LimitRequestFieldSize 32768

# ProxyPass is matched before the filesystem, so /api/ never reaches the FallbackResource
# above and an unknown API path still comes back as the backend's own 404.
ProxyPass /api/ http://backend:8080/api/
ProxyPassReverse /api/ http://backend:8080/api/

# Equivalent to nginx's `proxy_set_header Host $http_host`, and just as load-bearing: the
# backend builds the OIDC redirect_uri from the Host header, so rewriting it to the
# upstream's name sends the browser to the backend's own port after sign-in.
ProxyPreserveHost On

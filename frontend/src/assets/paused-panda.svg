<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title">
  <title id="title">A cartoon panda chewing on bamboo</title>
  <!-- A light badge behind the panda, so the dark outlines read on a dark page as well. -->
  <circle cx="120" cy="124" r="112" fill="#e9f5e1"/>
  <ellipse cx="120" cy="222" rx="78" ry="9" fill="#cfe5c2"/>

  <g stroke="#1d1d1f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears, behind the head -->
    <circle cx="80" cy="54" r="17" fill="#1d1d1f"/>
    <circle cx="160" cy="54" r="17" fill="#1d1d1f"/>

    <!-- body and feet -->
    <ellipse cx="120" cy="168" rx="64" ry="54" fill="#ffffff"/>
    <ellipse cx="76" cy="208" rx="27" ry="17" fill="#1d1d1f"/>
    <ellipse cx="164" cy="208" rx="27" ry="17" fill="#1d1d1f"/>

    <!-- head -->
    <circle cx="120" cy="94" r="50" fill="#ffffff"/>
  </g>

  <!-- foot pads -->
  <ellipse cx="72" cy="209" rx="10" ry="7" fill="#5b5b60"/>
  <ellipse cx="168" cy="209" rx="10" ry="7" fill="#5b5b60"/>

  <!-- eye patches, eyes with a highlight, a sleepy-happy look -->
  <ellipse cx="98" cy="90" rx="13" ry="17" transform="rotate(-28 98 90)" fill="#1d1d1f"/>
  <ellipse cx="142" cy="90" rx="13" ry="17" transform="rotate(28 142 90)" fill="#1d1d1f"/>
  <circle cx="100" cy="88" r="6" fill="#ffffff"/>
  <circle cx="140" cy="88" r="6" fill="#ffffff"/>
  <circle cx="101" cy="89" r="3" fill="#1d1d1f"/>
  <circle cx="139" cy="89" r="3" fill="#1d1d1f"/>
  <circle cx="99" cy="86.5" r="1.3" fill="#ffffff"/>
  <circle cx="141" cy="86.5" r="1.3" fill="#ffffff"/>

  <!-- nose, cheeks and a chewing mouth -->
  <ellipse cx="120" cy="108" rx="8" ry="5.5" fill="#1d1d1f"/>
  <circle cx="88" cy="112" r="7.5" fill="#f5a3b6" opacity="0.85"/>
  <circle cx="152" cy="112" r="7.5" fill="#f5a3b6" opacity="0.85"/>
  <path d="M109 117 q5 6 11 1 q6 5 11 -1" fill="none" stroke="#1d1d1f" stroke-width="3.5" stroke-linecap="round"/>

  <!-- the bamboo, held across the body, its top end in the mouth -->
  <g stroke-linecap="round">
    <line x1="52" y1="214" x2="128" y2="122" stroke="#1d1d1f" stroke-width="21"/>
    <line x1="52" y1="214" x2="128" y2="122" stroke="#7cc45a" stroke-width="13"/>
    <line x1="58" y1="198" x2="122" y2="122" stroke="#a8de86" stroke-width="3.5"/>
  </g>
  <!-- the stalk's nodes -->
  <g stroke="#1d1d1f" stroke-width="4" stroke-linecap="round">
    <line x1="68" y1="187" x2="82" y2="198"/>
    <line x1="91" y1="159" x2="105" y2="170"/>
    <line x1="113" y1="132" x2="125" y2="142"/>
  </g>
  <!-- a bitten-off end: a few crumbs -->
  <g fill="#7cc45a" stroke="#1d1d1f" stroke-width="2">
    <circle cx="146" cy="130" r="3"/>
    <circle cx="153" cy="140" r="2.5"/>
    <circle cx="140" cy="143" r="2"/>
  </g>

  <!-- a leafy twig off the lowest node -->
  <g stroke="#1d1d1f" stroke-width="3.5" stroke-linejoin="round">
    <path d="M70 190 C 50 182 36 170 26 152" fill="none"/>
    <path d="M44 172 C 30 168 20 158 18 146 C 32 148 42 158 44 172 Z" fill="#5fae3e"/>
    <path d="M34 160 C 30 146 34 132 44 124 C 48 138 44 150 34 160 Z" fill="#7cc45a"/>
    <path d="M56 182 C 46 192 32 196 20 192 C 28 182 42 178 56 182 Z" fill="#5fae3e"/>
  </g>

  <!-- paws over the stalk -->
  <g stroke="#1d1d1f" stroke-width="5">
    <ellipse cx="86" cy="170" rx="19" ry="14" transform="rotate(-38 86 170)" fill="#1d1d1f"/>
    <ellipse cx="120" cy="146" rx="18" ry="13" transform="rotate(-38 120 146)" fill="#1d1d1f"/>
  </g>

  <!-- comic touches: chewing motion lines and the sound of it -->
  <g fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round">
    <path d="M176 108 q6 4 6 11"/>
    <path d="M185 101 q8 6 8 17"/>
  </g>
  <text x="200" y="138" transform="rotate(-8 200 138)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">munch</text>
  <text x="204" y="156" transform="rotate(-8 204 156)" font-family="'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">munch</text>
</svg>
